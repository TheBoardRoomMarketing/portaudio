      '<span class="eyebrow">History</span><h1>' + MONTHS[mo - 1] + " " + yr + "</h1>" +
      '<p class="page-sub">' + a.sessions + " sessions · " + a.trades + " trades · " +
      a.noTrade + (a.noTrade === 1 ? " day" : " days") + " with no trade taken</p></div>" +
      '<div class="row">' + months.map(function (k) {
        var p = k.split("-");
        return '<button class="btn" data-cal="' + k + '"' +
          (k === calMonth ? ' style="border-color:var(--accent);color:var(--accent-2)"' : "") + ">" +
          MONTHS[+p[1] - 1].slice(0, 3) + " " + p[0] + "</button>";
      }).join("") + "</div></div>" +

      '<div class="stats stats-4" style="margin-bottom:20px">' +
        stat("Month R", fmtR(a.r), outcomeWord(a.r), cls(a.r)) +
        stat("Process average", fmtNum(a.avgProcess, 0), "of 100", "sm") +
        stat("Rule flags", String(a.mistakes), "across " + a.sessions + " sessions", "sm") +
        stat("Setups missed", String(a.missed), "of " + a.opps + " qualified", "sm") +
      "</div>" +

      '<section class="card"><div class="cal" style="margin-bottom:8px">' +
      ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(function (d) {
        return '<div class="cal-dow">' + d + "</div>"; }).join("") + "</div>" +
      '<div class="cal">' + cells + "</div>" +
      '<div class="legend" style="margin-top:16px">' +
      '<span><i style="background:var(--clay)"></i>rule flag — labelled on the day</span>' +
      '<span><i style="background:var(--amber)"></i>qualified setup missed</span>' +
      '<span><i style="background:var(--accent)"></i>clean process, score 80+</span>' +
      '<span class="muted">Every marker is also written out in words; colour is never the only carrier.</span>' +
      "</div></section>";
  }

  /* ------------------------------------------------------------------ view: WEEKLY */
  var weekKey = null;

  function viewWeekly() {
    var weeks = weeksDesc();
    if (!weekKey || weeks.indexOf(weekKey) < 0) weekKey = weeks[0];
    var list = sessionsIn(weekKey, "iso_week");
    var a = aggregate(list);
    var prevList = sessionsIn(weeks[weeks.indexOf(weekKey) + 1] || "", "iso_week");
    var prev = aggregate(prevList);

    var byStrategy = {};
    list.forEach(function (s) {
      s.opportunities.forEach(function (o) {
        var k = o.strategy_id;
        byStrategy[k] = byStrategy[k] || { opps: 0, taken: 0, missed: 0, r: 0, mech: 0 };
        byStrategy[k].opps++;
        if (o.status === "TAKEN" || o.status === "BOT_EXECUTED") byStrategy[k].taken++;
        if (o.status === "MISSED") byStrategy[k].missed++;
        byStrategy[k].mech += o.mechanical_r || 0;
      });
      s.trades.forEach(function (t) {
        byStrategy[t.strategy_id] = byStrategy[t.strategy_id] || { opps: 0, taken: 0, missed: 0, r: 0, mech: 0 };
        byStrategy[t.strategy_id].r += t.r_multiple || 0;
      });
    });

    var mistakes = {};
    list.forEach(function (s) {
      s.trades.forEach(function (t) {
        t.tags.forEach(function (g) { mistakes[g] = (mistakes[g] || 0) + 1; });
      });
      if ((s.post || {}).missed_qualified) mistakes.MISSED_SETUP = (mistakes.MISSED_SETUP || 0) + 1;
    });
    var mistakeRows = Object.keys(mistakes).sort(function (x, y) { return mistakes[y] - mistakes[x]; })
      .map(function (k) { return { label: tagLabel(k), value: mistakes[k], display: String(mistakes[k]), warm: true }; });

    var best = list.slice().sort(function (x, y) { return (m(y).total_r || 0) - (m(x).total_r || 0); })[0];
    var worstProcess = list.slice().filter(function (s) { return m(s).process_score != null; })
      .sort(function (x, y) { return (m(x).process_score || 0) - (m(y).process_score || 0); })[0];

    var focus = [];
    if (a.missed > 0) focus.push("Be at the desk for the " + (a.missed === 1 ? "one setup" : a.missed + " setups") +
      " that qualified while you were away — that is where most of the week's lost R sits.");
    if (mistakes.LATE_ENTRY) focus.push("Late entries appeared " + mistakes.LATE_ENTRY +
      " time" + (mistakes.LATE_ENTRY > 1 ? "s" : "") + ". Set the entry order at signal time rather than after confirming twice.");
    if (mistakes.OVERTRADE) focus.push("Overtrading was flagged on " + mistakes.OVERTRADE +
      " occasion" + (mistakes.OVERTRADE > 1 ? "s" : "") + ". Hold the planned trade cap.");
    if (!focus.length) focus.push("No repeat behaviour stands out this week. Keep the current pre-session routine.");

    return '<div class="page-head"><div class="grow">' +
      '<span class="eyebrow">Weekly review</span><h1>' + esc(weekKey) + "</h1>" +
      '<p class="page-sub">' + (list.length ? esc(longDate(list[0].date)) + " – " + esc(longDate(list[list.length - 1].date)) : "") + "</p></div>" +
      '<div class="row">' + weeks.slice(0, 6).map(function (k) {
        return '<button class="btn" data-week="' + k + '"' +
          (k === weekKey ? ' style="border-color:var(--accent);color:var(--accent-2)"' : "") + ">" + esc(k) + "</button>";
      }).join("") + "</div></div>" +

      '<span class="eyebrow">Performance</span>' +
      '<div class="stats stats-4" style="margin-bottom:20px">' +
        stat("Week R", fmtR(a.r), outcomeWord(a.r), cls(a.r)) +
        stat("Expectancy", fmtR(a.expectancy), "per trade over " + a.trades, "sm") +
        stat("Profit factor", a.pf ? fmtNum(a.pf, 2) : "—", fmtNum(a.winRate, 0) + "% winners", "sm") +
        stat("Max drawdown", fmtR(a.maxDD), "intra-week, session grain", "sm " + cls(a.maxDD)) +
      "</div>" +

      '<div class="grid g-main"><div class="stack">' +
        '<section class="card"><div class="card-head"><span class="eyebrow">Cumulative R</span></div>' +
        equityCurve(list) + "</section>" +
        '<section class="card"><div class="card-head"><span class="eyebrow">By session</span></div>' +
        dailyBars(list) + "</section>" +

        '<section class="card"><div class="card-head"><span class="eyebrow">Strategies</span></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Strategy</th><th class="n">Qual.</th>' +
        '<th class="n">Taken</th><th class="n">Missed</th><th class="n">You</th><th class="n">Rules</th>' +
        '<th class="n">Diff.</th></tr></thead><tbody>' +
        Object.keys(byStrategy).map(function (k) {
          var v = byStrategy[k], d = v.r - v.mech;
          return "<tr><td>" + esc(k.replace(/_/g, " ")) + '</td><td class="n">' + v.opps +
            '</td><td class="n">' + v.taken + '</td><td class="n">' + v.missed +
            '</td><td class="n ' + cls(v.r) + '">' + fmtR(v.r, 1) + '</td><td class="n">' + fmtR(v.mech, 1) +
            '</td><td class="n ' + cls(d) + '">' + fmtR(d, 1) + "</td></tr>";
        }).join("") + "</tbody></table></div></section>" +

        '<section class="card"><div class="card-head"><span class="eyebrow">Manual vs mechanical</span>' +
        '<span class="muted small">the discretion audit</span></div>' +
        '<div class="stats stats-3" style="border-radius:var(--r-sm)">' +
          stat("You", fmtR(a.r), "as executed", "sm " + cls(a.r)) +
          stat("Rules alone", fmtR(a.mech), "all qualified setups", "sm") +
          stat("Difference", fmtR(a.uva), a.uva >= 0 ? "discretion added" : "discretion cost", "sm " + cls(a.uva)) +
        "</div><p class=\"small muted\" style=\"margin-top:12px\">Missed setups count against you here: " +
        "the mechanical column includes every qualified setup, taken or not.</p></section>" +

        '<section class="card"><div class="card-head"><span class="eyebrow">Missed opportunities</span>' +
        '<span class="muted small">' + a.missed + " of " + a.opps + " qualified setups</span></div>" +
        (a.missed
          ? '<div class="stack-sm">' + list.reduce(function (acc, s) {
              s.opportunities.filter(function (o) { return o.status === "MISSED"; }).forEach(function (o) {
                acc.push('<div class="rating"><span class="lbl">' + esc(shortDate(s.date)) + " " + etTime(o.qualified_at) +
                  " · " + esc(o.strategy_id.replace(/_/g, " ")) +
                  '<br><span class="muted small">' + esc(o.status_reason || "") + "</span></span>" +
                  '<span class="num ' + cls(o.mechanical_r) + '">' + fmtR(o.mechanical_r) + "</span></div>");
              });
              return acc;
            }, []).join("") + "</div>"
          : '<p class="muted">No qualified setup went untaken this week.</p>') + "</section>" +
      "</div><div class=\"stack\">" +
        '<span class="eyebrow" style="margin-bottom:-6px">Process</span>' +
        '<section class="card">' + dial(a.avgProcess, "Weekly process average") +
        '<div class="stack-sm" style="margin-top:14px">' +
          '<div class="rating"><span class="lbl">Rule adherence</span><span class="num">' + fmtNum(a.avgAdherence, 1) + "/5</span></div>" +
          '<div class="rating"><span class="lbl">Rule flags</span><span class="num">' + a.mistakes + "</span></div>" +
          '<div class="rating"><span class="lbl">Take rate</span><span class="num">' + fmtNum(a.takeRate, 0) + "%</span></div>" +
          '<div class="rating"><span class="lbl">Sessions with no trade</span><span class="num">' + a.noTrade + "</span></div>" +
          '<div class="rating"><span class="lbl">vs previous week</span><span class="num ' +
            cls(a.avgProcess - (prev.avgProcess || a.avgProcess)) + '">' +
            (prev.avgProcess ? (a.avgProcess >= prev.avgProcess ? "+" : MINUS) +
              Math.abs(a.avgProcess - prev.avgProcess).toFixed(0) : "—") + "</span></div>" +
        "</div></section>" +

        '<section class="card"><div class="card-head"><span class="eyebrow">Mistakes</span></div>' +
        (mistakeRows.length ? hbars(mistakeRows, { plain: true }) : '<p class="muted">None recorded.</p>') +
        "</section>" +

        '<section class="card"><div class="card-head"><span class="eyebrow">Sessions worth revisiting</span></div>' +
        (best ? '<div class="rating"><span class="lbl">Best result<br><span class="muted small">' +
          esc(longDate(best.date)) + '</span></span><a class="num ' + cls(m(best).total_r) +
          '" href="#/session/' + best.date + '">' + fmtR(m(best).total_r) + "</a></div>" : "") +
        (worstProcess ? '<div class="rating"><span class="lbl">Weakest process<br><span class="muted small">' +
          esc(longDate(worstProcess.date)) + '</span></span><a class="num" href="#/session/' + worstProcess.date + '">' +
          fmtNum(m(worstProcess).process_score, 0) + "/100</a></div>" : "") +
        "</section>" +

        '<section class="card"><div class="card-head"><span class="eyebrow">Next week</span></div>' +
        '<div class="reflect">' + focus.map(function (f, i) {
          return '<div class="reflect-item"><span class="k">Focus ' + (i + 1) + '</span><span class="t">' + esc(f) + "</span></div>";
        }).join("") + "</div>" +
        provenance("Generated from the week's record", { model: "journal-narrator", version: "0.2.0" }) +
        "</section>" +
      "</div></div>";
  }

  /* ------------------------------------------------------------------ view: MONTHLY */
  var monthKey = null;

  function viewMonthly() {
    var months = monthsDesc();
    if (!monthKey || months.indexOf(monthKey) < 0) monthKey = months[0];
    var list = sessionsIn(monthKey, "iso_month");
    var a = aggregate(list);
    var weeks = [];
    list.forEach(function (s) { if (weeks.indexOf(s.iso_week) < 0) weeks.push(s.iso_week); });
    var weekAgg = weeks.map(function (w) { return { week: w, a: aggregate(sessionsIn(w, "iso_week")) }; });
    var p = monthKey.split("-");

    var mistakeByWeek = weekAgg.map(function (w) {
      return { label: w.week, value: w.a.mistakes, display: String(w.a.mistakes), warm: true };
    });
    var processByWeek = weekAgg.map(function (w) {
      return { label: w.week, value: w.a.avgProcess || 0, display: fmtNum(w.a.avgProcess, 0) };
    });
    var rByWeek = weekAgg.map(function (w) {
      return { label: w.week, value: w.a.r, display: fmtR(w.a.r, 1), warm: w.a.r < 0 };
    });

    return '<div class="page-head"><div class="grow">' +
      '<span class="eyebrow">Monthly review</span><h1>' + MONTHS[+p[1] - 1] + " " + p[0] + "</h1>" +
      '<p class="page-sub">' + a.sessions + " sessions · " + a.trades + " trades · " +
      weeks.length + " weeks</p></div>" +
      '<div class="row">' + months.map(function (k) {
        var q = k.split("-");
        return '<button class="btn" data-month="' + k + '"' +
          (k === monthKey ? ' style="border-color:var(--accent);color:var(--accent-2)"' : "") + ">" +
          MONTHS[+q[1] - 1].slice(0, 3) + "</button>";
      }).join("") + "</div></div>" +

      '<div class="stats stats-4" style="margin-bottom:20px">' +
        stat("Month R", fmtR(a.r), outcomeWord(a.r), cls(a.r)) +
        stat("Expectancy", fmtR(a.expectancy), "per trade", "sm") +
        stat("Process average", fmtNum(a.avgProcess, 0), "of 100", "sm") +
        stat("Discretion", fmtR(a.uva), a.uva >= 0 ? "added over rules" : "cost against rules", "sm " + cls(a.uva)) +
      "</div>" +

      '<div class="grid g-main"><div class="stack">' +
        '<section class="card"><div class="card-head"><span class="eyebrow">Cumulative R</span>' +
        '<span class="muted small">session grain</span></div>' + equityCurve(list, { h: 210 }) + "</section>" +
        '<section class="card"><div class="card-head"><span class="eyebrow">By session</span></div>' +
        dailyBars(list, { h: 140 }) + "</section>" +
        '<section class="card"><div class="card-head"><span class="eyebrow">Trend by week</span></div>' +
        '<span class="eyebrow">R</span>' + hbars(rByWeek) +
        '<hr class="divider" style="margin:16px 0"><span class="eyebrow">Process score</span>' + hbars(processByWeek, { plain: true }) +
        '<hr class="divider" style="margin:16px 0"><span class="eyebrow">Rule flags</span>' + hbars(mistakeByWeek, { plain: true }) +
        "</section>" +
      "</div><div class=\"stack\">" +
        '<section class="card"><div class="card-head"><span class="eyebrow">Consistency</span></div>' +
        '<div class="stack-sm">' +
        '<div class="rating"><span class="lbl">Sessions traded</span><span class="num">' + (a.sessions - a.noTrade) + " of " + a.sessions + "</span></div>" +
        '<div class="rating"><span class="lbl">Check-ins completed</span><span class="num">' + a.sessions + " of " + a.sessions + "</span></div>" +
        '<div class="rating"><span class="lbl">Take rate</span><span class="num">' + fmtNum(a.takeRate, 0) + "%</span></div>" +
        '<div class="rating"><span class="lbl">Setups missed</span><span class="num">' + a.missed + "</span></div>" +
        '<div class="rating"><span class="lbl">Flags per session</span><span class="num">' + fmtNum(a.mistakes / a.sessions, 2) + "</span></div>" +
        "</div></section>" +
        '<section class="card"><div class="card-head"><span class="eyebrow">Behaviour</span></div>' +
        '<p class="prose" style="font-size:15px">Rule flags fell from ' + (weekAgg[0] ? weekAgg[0].a.mistakes : 0) +
        " in the first week to " + (weekAgg[weekAgg.length - 1] ? weekAgg[weekAgg.length - 1].a.mistakes : 0) +
        " in the last. Process average " +
        (weekAgg.length > 1 && weekAgg[weekAgg.length - 1].a.avgProcess >= weekAgg[0].a.avgProcess ? "rose" : "fell") +
        " over the same span. Sessions with no trade taken: " + a.noTrade + ".</p>" +
        provenance("Generated from the month's record", { model: "journal-narrator", version: "0.2.0" }) + "</section>" +
        '<section class="card"><div class="card-head"><span class="eyebrow">Weeks</span></div>' +
        '<div class="stack-sm">' + weekAgg.map(function (w) {
          return '<div class="rating"><span class="lbl">' + esc(w.week) + '<br><span class="muted small">' +
            w.a.trades + " trades · process " + fmtNum(w.a.avgProcess, 0) + "</span></span>" +
            '<span class="num ' + cls(w.a.r) + '">' + fmtR(w.a.r, 1) + "</span></div>";
        }).join("") + "</div></section>" +
      "</div></div>";
  }

  /* ------------------------------------------------------------------ view: STRATEGIES */
  function viewStrategies() {
    var cards = D.strategies.map(function (sv) {
      var score = D.strategy_scorecard.filter(function (r) { return r.strategy_version_id === sv.id; })[0] || {};
      var trades = TRADES.filter(function (t) {
        return t.strategy_id === sv.strategy_id && t.strategy_version === sv.version;
      });
      var r = trades.reduce(function (x, t) { return x + (t.r_multiple || 0); }, 0);
      var wins = trades.filter(function (t) { return t.r_multiple > 0; }).length;
      var grossW = trades.filter(function (t) { return t.r_multiple > 0; })
        .reduce(function (x, t) { return x + t.r_multiple; }, 0);
      var grossL = trades.filter(function (t) { return t.r_multiple < 0; })
        .reduce(function (x, t) { return x + Math.abs(t.r_multiple); }, 0);
      var tags = {};
      trades.forEach(function (t) { t.tags.forEach(function (g) { tags[g] = (tags[g] || 0) + 1; }); });
      var regime = {};
      trades.forEach(function (t) {
        var k = ((t._session.market || [])[0] || {}).trend_state || "unknown";
        regime[k] = (regime[k] || 0) + 1;
      });
      var run = 0, peak = 0, dd = 0;
      trades.forEach(function (t) { run += t.r_multiple || 0; peak = Math.max(peak, run); dd = Math.min(dd, run - peak); });

      return '<section class="card"><div class="card-head"><div>' +
        '<span class="eyebrow">' + esc(sv.automation_level.replace("_", " ")) + " · " +
        esc(sv.qualification_status) + "</span>" +
        "<h2>" + esc(sv.name) + " <span class=\"num muted\" style=\"font-size:15px\">v" + esc(sv.version) + "</span></h2>" +
        '<p class="small muted">active ' + esc(sv.active_from) + " → " + esc(sv.active_to || "now") +
        " · rule hash <span class=\"num\">" + esc(sv.rule_hash.slice(0, 12)) + "</span></p></div>" +
        (sv.active_to ? '<span class="chip chip-ghost">retired</span>' : '<span class="chip chip-accent">in force</span>') +
        "</div>" +
        '<div class="stats stats-4" style="border-radius:var(--r-sm);margin-bottom:16px">' +
          stat("Trades", String(trades.length), wins + " winners", "sm") +
          stat("Total R", fmtR(r), "expectancy " + fmtR(trades.length ? r / trades.length : null, 2), "sm " + cls(r)) +
          stat("Profit factor", grossL ? fmtNum(grossW / grossL, 2) : "—", "gross " + fmtR(grossW, 1) + " / " + fmtR(-grossL, 1), "sm") +
          stat("Max drawdown", fmtR(dd), "trade grain", "sm " + cls(dd)) +
        "</div>" +
        '<div class="grid g-2" style="gap:22px"><div>' +
        '<span class="eyebrow">Opportunity handling</span><div class="stack-sm">' +
        '<div class="rating"><span class="lbl">Qualified</span><span class="num">' + (score.opportunities || 0) + "</span></div>" +
        '<div class="rating"><span class="lbl">Take rate</span><span class="num">' +
          (score.opportunities ? fmtNum((score.taken / score.opportunities) * 100, 0) + "%" : "—") + "</span></div>" +
        '<div class="rating"><span class="lbl">Miss rate</span><span class="num">' +
          (score.opportunities ? fmtNum((score.missed / score.opportunities) * 100, 0) + "%" : "—") + "</span></div>" +
        '<div class="rating"><span class="lbl">Skipped by rule</span><span class="num">' + (score.skipped_by_rule || 0) + "</span></div>" +
        '<div class="rating"><span class="lbl">Skipped by choice</span><span class="num">' + (score.skipped_discretionary || 0) + "</span></div>" +
        "</div></div><div>" +
        '<span class="eyebrow">You vs the rules</span><div class="stack-sm">' +
        '<div class="rating"><span class="lbl">Your average R</span><span class="num ' + cls(score.actual_avg_r) + '">' +
          fmtR(score.actual_avg_r, 2) + "</span></div>" +
        '<div class="rating"><span class="lbl">Mechanical average R</span><span class="num">' + fmtR(score.mechanical_avg_r, 2) + "</span></div>" +
        '<div class="rating"><span class="lbl">Difference over period</span><span class="num ' + cls(score.user_value_added_r) + '">' +
          fmtR(score.user_value_added_r, 1) + "</span></div>" +
        "</div>" +
        '<span class="eyebrow" style="margin-top:14px">Most common flags</span>' +
        (Object.keys(tags).length
          ? hbars(Object.keys(tags).sort(function (x, y) { return tags[y] - tags[x]; }).slice(0, 4).map(function (k) {
              return { label: tagLabel(k), value: tags[k], display: String(tags[k]), warm: true }; }), { plain: true })
          : '<p class="muted small">None recorded.</p>') +
        "</div></div>" +
        '<details class="disclosure" style="margin-top:6px"><summary>Market conditions</summary>' +
        hbars(Object.keys(regime).map(function (k) {
          return { label: k + " sessions", value: regime[k], display: String(regime[k]) }; }), { plain: true }) +
        "</details></section>";
    }).join("");

    return '<div class="page-head"><div class="grow">' +
      '<span class="eyebrow">Registry</span><h1>Strategies</h1>' +
      '<p class="page-sub">Every record points at the version that was in force at the time. ' +
      "Editing a strategy publishes a new version; it never rewrites history.</p></div></div>" +
      '<div class="stack">' + cards + "</div>" +
      '<div class="warnband" style="margin-top:20px"><span class="g">by design</span>' +
      "<p>Blinded research variables are not sliceable from this screen. Strategy performance here is " +
      "market and behaviour only. See <a href=\"#/research\">Research Mode</a>.</p></div>";
  }

  /* ------------------------------------------------------------------ view: RESEARCH */
  var researchUnlocked = false;

  function viewResearch() {
    if (!researchUnlocked) {
      return '<div class="page-head"><div class="grow">' +
        '<span class="eyebrow">Restricted</span><h1>Research Mode</h1>' +
        '<p class="page-sub">Blinded variables live here and nowhere else.</p></div></div>' +
        '<div class="locked"><h2 style="margin-bottom:10px">This section is blinded on purpose</h2>' +
        '<p class="prose" style="max-width:56ch;margin:0 auto 20px">Personal and market research features are ' +
        "computed for every session and stored, but they are never shown during check-in, check-out or daily " +
        "review. The point is to keep your expectations out of your own data. Opening this section writes an " +
        "entry to the unblinding log with a timestamp and a reason.</p>" +
        '<button class="btn btn-primary" data-unlock="1">Enter Research Mode</button>' +
        '<p class="small muted" style="margin-top:14px">Prototype: no real features are revealed.</p></div>';
    }

    var samples = D.research.sample_sizes;
    var prereg = D.research.preregistrations;
    var sessionsN = SESSIONS.length;

    return '<div class="page-head"><div class="grow">' +
      '<span class="eyebrow">Research Mode · unblinded session</span><h1>Research Mode</h1>' +
      '<p class="page-sub">Opened ' + esc(D.meta.generated_at) + " · logged</p></div>" +
      '<button class="btn" data-unlock="0">Leave and re-blind</button></div>' +

      '<div class="warnband" style="margin-bottom:20px"><span class="g">n = ' + sessionsN + "</span>" +
      "<p><b>Sample sizes here do not support conclusions.</b> With " + sessionsN + " sessions, any subgroup " +
      "you can name has fewer than 30 observations. This screen deliberately shows counts before it shows " +
      "effects, and it will not compute an effect for a feature below its preregistered minimum n.</p></div>" +

      '<div class="grid g-main"><div class="stack">' +
      '<section class="card"><div class="card-head"><span class="eyebrow">Feature sets</span>' +
      '<span class="muted small">keys are opaque by design</span></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Set</th><th>Key</th><th class="n">n</th>' +
      '<th>Status</th><th>Label</th></tr></thead><tbody>' +
      samples.map(function (r) {
        return "<tr><td>" + esc(r.feature_set) + '</td><td class="num">' + esc(r.feature_key) + "</td>" +
          '<td class="n">' + r.n_observations + "</td><td>" +
          '<span class="chip ' + (r.sample_status === "reportable" ? "chip-accent" :
            r.sample_status === "provisional" ? "chip-watch" : "chip-flag") + '">' + esc(r.sample_status) + "</span></td>" +
          '<td><span class="redacted">withheld until preregistered</span></td></tr>';
      }).join("") + "</tbody></table></div>" +
      '<p class="small muted" style="margin-top:12px">Feature labels are stored in a separate dictionary ' +
      "table and are only joined under a locked preregistration. Values are visible; meanings are not.</p></section>" +

      '<section class="card"><div class="card-head"><span class="eyebrow">Preregistered questions</span>' +
      '<button class="btn" disabled style="opacity:.55;cursor:not-allowed">New question</button></div>' +
      '<div class="stack-sm">' + prereg.map(function (p) {
        return '<div class="reflect-item"><span class="k">' + esc(p.status) + " · min n " + p.min_n +
          " · outcome " + esc(p.outcome_metric) + '</span><span class="t">' + esc(p.question) + "</span>" +
          '<p class="small muted" style="margin-top:4px">' + esc(p.hypothesis) + "</p></div>";
      }).join("") + "</div>" +
      '<p class="small muted" style="margin-top:12px">A question must be locked before the data is looked at. ' +
      "The lock stores a hash of the analysis plan so it cannot be edited after seeing the result.</p></section>" +

      '<section class="card"><div class="card-head"><span class="eyebrow">Available analyses</span></div>' +
      '<div class="stack-sm">' + [
        ["Personal state vs execution quality", sessionsN, 120],
        ["Personal state vs rule violations", sessionsN, 120],
        ["Sleep and focus vs mistake count", sessionsN, 60],
        ["Manual intervention vs mechanical outcome", 90, 100],
        ["Strategy vs market regime", sessionsN, 200]
      ].map(function (row) {
        var ok = row[1] >= row[2];
        return '<div class="rating"><span class="lbl">' + esc(row[0]) +
          '<br><span class="muted small">n = ' + row[1] + " · needs " + row[2] + "</span></span>" +
          '<span class="chip ' + (ok ? "chip-accent" : "chip-watch") + '">' +
          (ok ? "runnable" : "under-powered") + "</span></div>";
      }).join("") + "</div></section>" +
      "</div><div class=\"stack\">" +
      '<section class="card"><div class="card-head"><span class="eyebrow">Unblinding log</span></div>' +
      '<p class="muted small">No unblinding events recorded. This prototype does not reveal features; ' +
      "in the real system every entry into this mode is written here with actor, scope and reason.</p></section>" +
      '<section class="card"><div class="card-head"><span class="eyebrow">Rules of this room</span></div>' +
      '<div class="reflect">' +
      '<div class="reflect-item"><span class="k">1</span><span class="t">Questions are written down before the data is looked at.</span></div>' +
      '<div class="reflect-item"><span class="k">2</span><span class="t">No weekly automatic slicing. Nothing here runs on a schedule.</span></div>' +
      '<div class="reflect-item"><span class="k">3</span><span class="t">Findings below the preregistered n are not shown, not even greyed out.</span></div>' +
      '<div class="reflect-item"><span class="k">4</span><span class="t">Nothing from this screen is ever surfaced during a trading session.</span></div>' +
      "</div></section></div></div>";
  }

  /* ------------------------------------------------------------------ view: CAPTURE */
  function viewCapture() {
    return '<div class="page-head"><div class="grow">' +
      '<span class="eyebrow">Mobile intake</span><h1>Capture</h1>' +
      '<p class="page-sub">The two moments that have to be frictionless. Everything else in this ' +
      "journal can be reconstructed from data; these cannot.</p></div></div>" +

      '<div class="phones">' +
      '<div><div class="phone"><div class="phone-screen">' +
        '<div class="phone-status"><span>9:10</span><span>Pre-session</span></div>' +
        '<div class="notif"><div><span class="src">Trading Journal</span>' +
        "<p><b>Twenty minutes to the open.</b> Thirty seconds — how are you arriving today?</p></div></div>" +
        '<div class="stack-sm">' +
        slider("Sleep", "sleep", 6.2, 3, 10, 0.1, " h") +
        slider("Energy", "energy", 3, 1, 5, 1, "/5") +
        slider("Focus", "focus", 4, 1, 5, 1, "/5") +
        slider("Stress", "stress", 2, 1, 5, 1, "/5") +
        slider("Desire to trade", "desire", 3, 1, 5, 1, "/5") +
        "</div>" +
        '<div><span class="eyebrow">Bias</span><div class="seg" data-seg="bias">' +
        ["Bullish", "Neutral", "Bearish"].map(function (b, i) {
          return "<button aria-pressed=\"" + (i === 1) + "\">" + b + "</button>"; }).join("") + "</div></div>" +
        '<div><span class="eyebrow">A well-traded day today means</span>' +
        '<textarea class="note" rows="2">Only A-setups. Two trades maximum.</textarea></div>' +
        '<details class="disclosure"><summary>More (optional)</summary>' +
        '<div class="stack-sm">' + slider("Impulsivity", "imp", 2, 1, 5, 1, "/5") +
        slider("Confidence", "conf", 4, 1, 5, 1, "/5") +
        '<div class="rating"><span class="lbl">Pressure to make money</span>' +
        '<div class="seg" data-seg="press" style="width:110px"><button aria-pressed="false">Yes</button>' +
        '<button aria-pressed="true">No</button></div></div></div></details>' +
        '<button class="btn btn-primary" style="justify-content:center">Save and start the day</button>' +
        '<p class="small muted center">Median completion in the prototype: 41 seconds.</p>' +
      "</div></div>" +
      '<p class="phone-caption"><b>Morning.</b> Five sliders, one segmented control, one sentence. ' +
      "Everything else is behind “More”. The one required free-text field is the definition of a " +
      "well-traded day, because it is what the evening check-out is scored against.</p></div>" +

      '<div><div class="phone"><div class="phone-screen">' +
        '<div class="phone-status"><span>16:05</span><span>Post-session</span></div>' +
        '<div class="notif"><div><span class="src">Trading Journal</span>' +
        "<p><b>Session closed.</b> 2 trades, 3 qualified setups. Two minutes to close the day.</p></div></div>" +
        '<div class="stack-sm">' +
        slider("Execution quality", "exq", 4, 1, 5, 1, "/5") +
        slider("Rule adherence", "adh", 4, 1, 5, 1, "/5") +
        slider("Patience", "pat", 3, 1, 5, 1, "/5") +
        slider("Emotional control", "emo", 4, 1, 5, 1, "/5") +
        "</div>" +
        '<div><span class="eyebrow">Anything happen?</span><div class="checks">' +
        ["Overtraded", "Revenge trade", "Stop moved", "Oversized", "Missed a setup", "Overrode a rule"]
          .map(function (c, i) {
            return '<button class="check" aria-pressed="' + (i === 4) + '"><span class="box"></span>' + c + "</button>";
          }).join("") + "</div></div>" +
        '<div><span class="eyebrow">Would this be a well-traded day with P&amp;L hidden?</span>' +
        '<div class="seg" data-seg="wt">' + ["Yes", "Mixed", "No"].map(function (b, i) {
          return "<button aria-pressed=\"" + (i === 1) + "\">" + b + "</button>"; }).join("") + "</div></div>" +
        '<button class="mic"><span class="dot"></span><span class="t">Hold to record a voice note</span>' +
        '<span class="num">0:48</span></button>' +
        '<button class="btn btn-primary" style="justify-content:center">Finish session</button>' +
        '<p class="small muted center">Best decision and biggest mistake are asked on the next card.</p>' +
      "</div></div>" +
      '<p class="phone-caption"><b>Evening.</b> Four ratings, six checkboxes, one verdict, one optional ' +
      "voice note. The mistake checkboxes write straight into the taxonomy; the voice note is stored as " +
      "audio plus verbatim transcript and is never edited by a model.</p></div>" +
      "</div>" +

      '<section class="card" style="margin-top:28px"><div class="card-head">' +
      '<span class="eyebrow">How the prompt arrives</span></div>' +
      '<div class="grid g-3">' +
      ["A scheduled job on your machine (launchd / cron / Task Scheduler) fires at 09:10 and 16:05 ET " +
       "and posts a notification. Nothing needs to be running or watching.",
       "The notification opens the local web app straight onto the form for that session — no navigation, " +
       "no login, no picking a date.",
       "If a check-in is skipped, the session is still created and marked incomplete. Missing data is " +
       "recorded as missing, never back-filled from memory a week later."
      ].map(function (t, i) {
        return '<div class="reflect-item"><span class="k">Step ' + (i + 1) + '</span><span class="t" ' +
          'style="font-size:14.5px">' + esc(t) + "</span></div>";
      }).join("") + "</div></section>";
  }

  function slider(label, id, value, min, max, step, unit) {
    return '<div class="slider-row"><div class="top"><span class="lbl">' + esc(label) + "</span>" +
      '<span class="val" data-out="' + id + '">' + value + esc(unit) + "</span></div>" +
      '<input type="range" data-slider="' + id + '" data-unit="' + esc(unit) + '" min="' + min +
      '" max="' + max + '" step="' + step + '" value="' + value + '" aria-label="' + esc(label) + '"></div>';
  }

  /* ------------------------------------------------------------------ router */
  var ROUTES = [
    ["#/today", "Today", "◈"], ["#/calendar", "History", "▦"], ["#/weekly", "Weekly", "▤"],
    ["#/monthly", "Monthly", "▥"], ["#/strategies", "Strategies", "◇"], ["#/capture", "Capture", "✎"]
  ];

  function render() {
    var hash = location.hash || "#/today";
    var parts = hash.split("/");
    var main = document.getElementById("view");
    var html;

    if (parts[1] === "session") html = viewSession(parts[2]);
    else if (parts[1] === "trade") html = viewTrade(parts[2]);
    else if (parts[1] === "calendar") html = viewCalendar();
    else if (parts[1] === "weekly") html = viewWeekly();
    else if (parts[1] === "monthly") html = viewMonthly();
    else if (parts[1] === "strategies") html = viewStrategies();
    else if (parts[1] === "research") html = viewResearch();
    else if (parts[1] === "capture") html = viewCapture();
    else html = viewToday();

    main.innerHTML = '<div class="view">' + html + "</div>";
    main.scrollTop = 0;
    window.scrollTo(0, 0);

    var current = "#/" + (parts[1] || "today");
    [].forEach.call(document.querySelectorAll("[data-nav]"), function (a) {
      var match = a.getAttribute("href") === current ||
        (current === "#/session" && a.getAttribute("href") === "#/calendar") ||
        (current === "#/trade" && a.getAttribute("href") === "#/calendar");
      if (match) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    wireCharts();
  }

  /* crosshair + tooltip for every chart that declares hot zones */
  function wireCharts() {
    [].forEach.call(document.querySelectorAll(".chart-wrap[data-chart]"), function (wrap) {
      var tip = wrap.querySelector(".tooltip");
      var svg = wrap.querySelector("svg");
      var cross = svg.querySelector(".cross");
      if (!tip || !svg) return;
      [].forEach.call(svg.querySelectorAll("[data-label]"), function (node) {
        node.addEventListener("mouseenter", function () {
          var box = svg.getBoundingClientRect();
          var vb = svg.viewBox.baseVal;
          var scale = box.width / vb.width;
          var cx = +node.getAttribute("data-cx") * scale;
          var cy = +node.getAttribute("data-cy") * scale;
          tip.textContent = node.getAttribute("data-label");
          tip.style.left = cx + "px";
          tip.style.top = (cy - 8) + "px";
          tip.classList.add("on");
          if (cross) {
            cross.setAttribute("x1", node.getAttribute("data-cx"));
            cross.setAttribute("x2", node.getAttribute("data-cx"));
            cross.setAttribute("opacity", "1");
          }
        });
      });
      wrap.addEventListener("mouseleave", function () {
        tip.classList.remove("on");
        if (cross) cross.setAttribute("opacity", "0");
      });
    });
  }

  /* ------------------------------------------------------------------ interactions */
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-daystate],[data-week],[data-month],[data-cal]," +
      "[data-unlock],[data-tl],[data-theme-btn],.seg button,.check") : null;
    if (!t) return;

    if (t.hasAttribute("data-daystate")) { dayState = t.getAttribute("data-daystate"); render(); return; }
    if (t.hasAttribute("data-week")) { weekKey = t.getAttribute("data-week"); render(); return; }
    if (t.hasAttribute("data-month")) { monthKey = t.getAttribute("data-month"); render(); return; }
    if (t.hasAttribute("data-cal")) { calMonth = t.getAttribute("data-cal"); render(); return; }
    if (t.hasAttribute("data-unlock")) { researchUnlocked = t.getAttribute("data-unlock") === "1"; render(); return; }
    if (t.hasAttribute("data-theme-btn")) { toggleTheme(); return; }
    if (t.hasAttribute("data-tl")) {
      var panel = document.getElementById("tl-" + t.getAttribute("data-tl"));
      var open = t.getAttribute("aria-expanded") === "true";
      t.setAttribute("aria-expanded", String(!open));
      if (panel) panel.hidden = open;
      return;
    }
    if (t.classList.contains("check")) {
      t.setAttribute("aria-pressed", t.getAttribute("aria-pressed") === "true" ? "false" : "true");
      return;
    }
    if (t.parentElement && t.parentElement.classList.contains("seg")) {
      [].forEach.call(t.parentElement.children, function (b) { b.setAttribute("aria-pressed", "false"); });
      t.setAttribute("aria-pressed", "true");
    }
  });

  document.addEventListener("input", function (e) {
    var s = e.target;
    if (!s.hasAttribute || !s.hasAttribute("data-slider")) return;
    var out = document.querySelector('[data-out="' + s.getAttribute("data-slider") + '"]');
    if (out) out.textContent = s.value + s.getAttribute("data-unit");
  });

  function toggleTheme() {
    var root = document.documentElement;
    var now = root.getAttribute("data-theme");
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = now ? (now === "dark" ? "light" : "dark") : (prefersDark ? "light" : "dark");
    root.setAttribute("data-theme", next);
    var btn = document.querySelector("[data-theme-btn] .theme-state");
    if (btn) btn.textContent = next === "dark" ? "Dark" : "Light";
  }

  /* ------------------------------------------------------------------ chrome */
  function chrome() {
    var nav = ROUTES.map(function (r) {
      return '<a data-nav href="' + r[0] + '">' + r[1] + "</a>";
    }).join("");

    document.getElementById("rail").innerHTML =
      '<div class="wordmark"><b>Trading Journal</b><span>v1 prototype</span></div>' +
      '<nav class="nav">' + nav +
      '<span class="nav-group-label">Restricted</span>' +
      '<a data-nav href="#/research">Research Mode <span class="lock">blinded</span></a>' +
      "</nav>" +
      '<div class="rail-foot">' +
      '<button class="theme-toggle" data-theme-btn><span>Appearance</span>' +
      '<span class="spacer"></span><span class="theme-state num">Auto</span></button>' +
      '<p class="synthetic-note">All figures are synthetic placeholder data generated from the schema. ' +
      "No real trading records, no broker connection.</p></div>";

    document.getElementById("topbar").innerHTML =
      "<b>Trading Journal</b>" +
      '<p class="synthetic-note">synthetic data</p>';

    document.getElementById("tabbar").innerHTML =
      [["#/today", "Today", "◈"], ["#/calendar", "History", "▦"], ["#/weekly", "Weekly", "▤"],
       ["#/strategies", "Setups", "◇"], ["#/capture", "Capture", "✎"]].map(function (r) {
        return '<a data-nav href="' + r[0] + '"><span class="g" aria-hidden="true">' + r[2] +
          "</span>" + r[1] + "</a>";
      }).join("");
  }

  chrome();
  window.addEventListener("hashchange", render);
  render();
})();

</script>
