<style>
/* =============================================================================
   Trading Journal v1 — prototype stylesheet

   Design direction: "the session log". A logbook, not a terminal. Time is the
   spine; numbers are instruments; prose is set in a serif because a journal is
   something you read, not something you monitor.

   The one deliberate rule: P&L is never green or red. Positive R takes the
   page's single accent, negative takes clay, and both always carry a sign and a
   word so colour is redundant. The only warm alert colour in the system is
   reserved for *process* — rule flags and missed setups. The eye is pulled
   toward behaviour, not outcome. That is the product thesis, rendered.

   Palette validated for CVD separation, lightness band, chroma floor and
   contrast in both modes (see docs/06-ux-and-design-system.md §4).
   ============================================================================= */

/* ---------- tokens: light is the base, every colour defined here ---------- */
:root {
  --paper:      #F2F5F6;
  --card:       #FCFDFD;
  --card-2:     #EAEFF1;
  --card-3:     #E2E9EB;
  --ink:        #16232B;
  --ink-2:      #4B5C66;
  --ink-3:      #7C8D96;
  --rule:       #D9E1E4;
  --rule-2:     #C6D2D6;
  --accent:     #00719A;
  --accent-2:   #005574;
  --accent-wash:#E1EDF2;
  --clay:       #BC5A2E;
  --clay-wash:  #F6E7DF;
  --amber:      #8A6A1E;
  --amber-wash: #F3ECD9;
  --shadow:     0 1px 2px rgba(22, 35, 43, .05), 0 8px 24px -16px rgba(22, 35, 43, .28);
  --shadow-lift:0 2px 4px rgba(22, 35, 43, .07), 0 18px 40px -22px rgba(22, 35, 43, .38);

  --serif: ui-serif, "Iowan Old Style", "Charter", "Bitstream Charter", "Palatino Linotype",
           Palatino, "Book Antiqua", Georgia, serif;
  --sans:  ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text",
           "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:  ui-monospace, "SF Mono", "JetBrains Mono", "IBM Plex Mono", Menlo, Consolas,
           "DejaVu Sans Mono", monospace;

  --rail: 236px;
  --maxw: 1120px;
  --r-sm: 5px;
  --r-md: 10px;
  --r-lg: 16px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #0F1417;
    --card:       #161D21;
    --card-2:     #1C252A;
    --card-3:     #242F35;
    --ink:        #E8EDEF;
    --ink-2:      #A5B3BA;
    --ink-3:      #74858D;
    --rule:       #263137;
    --rule-2:     #33424A;
    --accent:     #22A2C0;
    --accent-2:   #56BDD6;
    --accent-wash:#10333E;
    --clay:       #D4783F;
    --clay-wash:  #3A2418;
    --amber:      #C09A4E;
    --amber-wash: #2E2614;
    --shadow:     0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .7);
    --shadow-lift:0 2px 4px rgba(0, 0, 0, .45), 0 18px 40px -22px rgba(0, 0, 0, .8);
  }
}

:root[data-theme="dark"] {
  --paper:      #0F1417;
  --card:       #161D21;
  --card-2:     #1C252A;
  --card-3:     #242F35;
  --ink:        #E8EDEF;
  --ink-2:      #A5B3BA;
  --ink-3:      #74858D;
  --rule:       #263137;
  --rule-2:     #33424A;
  --accent:     #22A2C0;
  --accent-2:   #56BDD6;
  --accent-wash:#10333E;
  --clay:       #D4783F;
  --clay-wash:  #3A2418;
  --amber:      #C09A4E;
  --amber-wash: #2E2614;
  --shadow:     0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .7);
  --shadow-lift:0 2px 4px rgba(0, 0, 0, .45), 0 18px 40px -22px rgba(0, 0, 0, .8);
}

/* ---------- base ---------- */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.012em; }
h2 { font-size: 21px; line-height: 1.25; }
h3 { font-size: 17px; line-height: 1.3; }
p  { margin: 0; }
a  { color: var(--accent-2); text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); }

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.prose { font-family: var(--serif); font-size: 16px; line-height: 1.65; color: var(--ink-2); }
.prose strong { color: var(--ink); font-weight: 600; }

/* ---------- app frame ---------- */
.app { display: flex; min-height: 100vh; }

.rail {
  width: var(--rail);
  flex: 0 0 var(--rail);
  border-right: 1px solid var(--rule);
  background: var(--card);
  padding: 26px 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 26px;
  position: sticky;
  top: 0;
  height: 100vh;
}

.wordmark { display: flex; flex-direction: column; gap: 2px; padding-left: 8px; }
.wordmark b { font-family: var(--serif); font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.wordmark span {
  font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3);
}

.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-group-label {
  font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); padding: 14px 8px 6px;
}
.nav a {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 10px; border-radius: var(--r-sm);
  color: var(--ink-2); text-decoration: none; font-size: 14.5px;
}
.nav a:hover { background: var(--card-2); color: var(--ink); }
.nav a[aria-current="page"] {
  background: var(--accent-wash); color: var(--accent-2); font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent);
}
.nav a .lock { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: .06em; }

.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.theme-toggle {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border: 1px solid var(--rule); border-radius: var(--r-sm);
  font-size: 13px; color: var(--ink-2); background: var(--card);
}
.theme-toggle:hover { border-color: var(--rule-2); color: var(--ink); }
.synthetic-note {
  font-size: 11.5px; line-height: 1.45; color: var(--ink-3);
  border-top: 1px solid var(--rule); padding-top: 12px;
}

.main { flex: 1 1 auto; min-width: 0; }
.view { max-width: var(--maxw); margin: 0 auto; padding: 38px 40px 96px; }

@media (prefers-reduced-motion: no-preference) {
  .view { animation: rise .28s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
}

/* ---------- page header ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 24px; margin-bottom: 26px; }
.page-head .grow { flex: 1 1 260px; min-width: 0; }
.eyebrow {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3); display: block; margin-bottom: 6px;
}
.page-sub { color: var(--ink-2); font-size: 14.5px; margin-top: 6px; }

/* ---------- cards ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  padding: 22px 24px;
  box-shadow: var(--shadow);
}
.card-quiet { background: none; box-shadow: none; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.card-head .eyebrow { margin: 0; }

.grid { display: grid; gap: 18px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-fit { grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr); align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1 1 auto; }

/* ---------- stat blocks ---------- */
.stats { display: grid; gap: 1px; background: var(--rule); border-radius: var(--r-md); overflow: hidden; }
.stats-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stats-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { background: var(--card); padding: 16px 18px 18px; }
.stat .k {
  font-family: var(--mono); font-size: 10px; letter-spacing: .11em; text-transform: uppercase;
  color: var(--ink-3); display: block; margin-bottom: 7px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.stat .v { font-family: var(--mono); font-size: 25px; font-variant-numeric: tabular-nums;
           letter-spacing: -0.02em; line-height: 1.05; display: block; }
.stat .s { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; display: block; }
.stat .v.sm { font-size: 20px; }

.v-pos { color: var(--accent-2); }
.v-neg { color: var(--clay); }
.v-flat { color: var(--ink-2); }

/* ---------- chips / tags ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .04em;
  padding: 3px 8px; border-radius: var(--r-sm);
  background: var(--card-2); color: var(--ink-2); border: 1px solid transparent;
  white-space: nowrap;
}
.chip-flag  { background: var(--clay-wash);  color: var(--clay);   border-color: color-mix(in srgb, var(--clay) 28%, transparent); }
.chip-watch { background: var(--amber-wash); color: var(--amber);  border-color: color-mix(in srgb, var(--amber) 30%, transparent); }
.chip-accent{ background: var(--accent-wash);color: var(--accent-2);border-color: color-mix(in srgb, var(--accent) 25%, transparent); }
.chip-ghost { background: none; border-color: var(--rule-2); color: var(--ink-3); }
.chip[data-glyph]::before { content: attr(data-glyph); font-size: 10px; }

/* ---------- process dial ---------- */
.dial { display: flex; align-items: center; gap: 14px; }
.dial svg { flex: 0 0 auto; }
.dial .dial-v { font-family: var(--mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.dial .dial-l { font-size: 12.5px; color: var(--ink-3); }

/* ---------- timeline ---------- */
.timeline { position: relative; margin: 4px 0 0; padding: 0; list-style: none; }
.timeline::before {
  content: ""; position: absolute; left: 63px; top: 10px; bottom: 10px;
  width: 1px; background: var(--rule);
}
.tl-item { position: relative; display: grid; grid-template-columns: 52px 24px minmax(0, 1fr); gap: 0 8px; }
.tl-time {
  font-family: var(--mono); font-size: 12px; color: var(--ink-3); text-align: right;
  padding-top: 13px; font-variant-numeric: tabular-nums;
}
.tl-dot { position: relative; }
.tl-dot i {
  position: absolute; left: 7px; top: 18px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--card); border: 1.5px solid var(--rule-2); box-sizing: border-box;
}
.tl-item[data-kind="trade"]   .tl-dot i { border-color: var(--accent); background: var(--accent); }
.tl-item[data-kind="missed"]  .tl-dot i { border-color: var(--amber); background: var(--amber); }
.tl-item[data-kind="flag"]    .tl-dot i { border-color: var(--clay); background: var(--clay); }
.tl-body { padding: 10px 0 12px; border-bottom: 1px solid var(--rule); min-width: 0; }
.tl-item:last-child .tl-body { border-bottom: 0; }
.tl-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tl-title { font-size: 14.5px; color: var(--ink); }
.tl-meta { font-size: 12.5px; color: var(--ink-3); }
.tl-toggle {
  display: block; width: 100%; text-align: left; padding: 0; border-radius: var(--r-sm);
}
.tl-toggle:hover .tl-title { color: var(--accent-2); }
.tl-detail { margin-top: 8px; font-size: 13.5px; color: var(--ink-2); }
.tl-detail[hidden] { display: none; }

/* ---------- trade card ---------- */
.trade-card {
  display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 20px;
  background: var(--card); border: 1px solid var(--rule); border-radius: var(--r-md);
  padding: 16px; text-decoration: none; color: inherit;
}
.trade-card:hover { border-color: var(--rule-2); box-shadow: var(--shadow-lift); }
.trade-chart { background: var(--card-2); border-radius: var(--r-sm); overflow: hidden;
               display: flex; align-items: center; }
.trade-chart svg { display: block; width: 100%; height: auto; }
.trade-main { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.trade-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.trade-title h3 { font-size: 16px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(86px, 1fr)); gap: 10px 16px; }
.kv .k { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
         color: var(--ink-3); display: block; }
.kv .v { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.trade-note { font-family: var(--serif); font-size: 14.5px; color: var(--ink-2); line-height: 1.5; }

/* ---------- charts ---------- */
figure { margin: 0; }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis-label { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: .06em; }
.grid-line { stroke: var(--rule); stroke-width: 1; }
.zero-line { stroke: var(--rule-2); stroke-width: 1; }
.series-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.series-area { fill: var(--accent); opacity: .10; }
.series-end { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.bar-pos { fill: var(--accent); }
.bar-neg { fill: var(--clay); }
.chart-cap { font-size: 12px; color: var(--ink-3); margin-top: 8px; }

.tooltip {
  position: absolute; pointer-events: none; z-index: 20; opacity: 0; transform: translate(-50%, -100%);
  background: var(--ink); color: var(--paper); padding: 7px 10px; border-radius: var(--r-sm);
  font-size: 12px; line-height: 1.4; white-space: nowrap; box-shadow: var(--shadow-lift);
}
.tooltip .num { font-size: 12.5px; }
.tooltip.on { opacity: 1; }

/* ---------- calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.cal-dow {
  font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); text-align: center; padding-bottom: 2px;
}
.cal-cell {
  min-height: 96px; border: 1px solid var(--rule); border-radius: var(--r-sm);
  background: var(--card); padding: 8px 9px; display: flex; flex-direction: column; gap: 5px;
  text-align: left; text-decoration: none; color: inherit;
}
.cal-cell.empty { background: none; border-style: dashed; border-color: color-mix(in srgb, var(--rule) 70%, transparent); }
.cal-cell.linked:hover { border-color: var(--accent); box-shadow: var(--shadow-lift); }
.cal-day { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.cal-r { font-family: var(--mono); font-size: 17px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.cal-tag { font-size: 11.5px; color: var(--ink-2); line-height: 1.3; }
.cal-marks { display: flex; gap: 4px; margin-top: auto; flex-wrap: wrap; }
.mark {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; padding: 1px 5px;
  border-radius: 3px; background: var(--card-2); color: var(--ink-3);
}
.mark-flag  { background: var(--clay-wash);  color: var(--clay); }
.mark-watch { background: var(--amber-wash); color: var(--amber); }
.mark-good  { background: var(--accent-wash);color: var(--accent-2); }

/* ---------- tables (used sparingly) ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 400;
}
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: 0; }

/* ---------- bars in lists ---------- */
.hbar { display: grid; grid-template-columns: 140px minmax(0, 1fr) 62px; gap: 12px; align-items: center; }
.hbar .lbl { font-size: 13.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { height: 8px; border-radius: 4px; background: var(--card-2); overflow: hidden; }
.hbar .fill { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.hbar .fill.warm { background: var(--clay); }
.hbar .val { font-family: var(--mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- reflection blocks ---------- */
.reflect { display: grid; gap: 14px; }
.reflect-item { border-left: 2px solid var(--rule-2); padding-left: 14px; }
.reflect-item .k {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); display: block; margin-bottom: 4px;
}
.reflect-item .t { font-family: var(--serif); font-size: 15.5px; line-height: 1.55; color: var(--ink); }
.reflect-item.flag { border-left-color: var(--clay); }

.quote {
  font-family: var(--serif); font-size: 15.5px; line-height: 1.6; color: var(--ink-2);
  background: var(--card-2); border-radius: var(--r-md); padding: 16px 18px;
}
.attrib { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
          color: var(--ink-3); margin-top: 10px; }

/* provenance strip — who wrote this, human or model */
.prov {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; color: var(--ink-3);
  border-top: 1px dashed var(--rule-2); padding-top: 10px; margin-top: 14px;
}
.prov b { font-weight: 400; color: var(--ink-2); }

/* ---------- ratings ---------- */
.rating { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.rating:last-child { border-bottom: 0; }
.rating .lbl { font-size: 13.5px; color: var(--ink-2); }
.pips { display: flex; gap: 3px; }
.pip { width: 9px; height: 9px; border-radius: 2px; background: var(--card-3); }
.pip.on { background: var(--accent); }
.pip.on.warm { background: var(--clay); }
.rating .n { font-family: var(--mono); font-size: 12px; color: var(--ink-3); width: 26px; text-align: right; }

/* ---------- research mode ---------- */
.locked {
  border: 1px dashed var(--rule-2); border-radius: var(--r-md); padding: 34px;
  text-align: center; background: repeating-linear-gradient(
     135deg, transparent, transparent 10px,
     color-mix(in srgb, var(--rule) 40%, transparent) 10px,
     color-mix(in srgb, var(--rule) 40%, transparent) 11px);
}
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px;
  border-radius: var(--r-sm); border: 1px solid var(--rule-2); background: var(--card);
  font-size: 14px; color: var(--ink);
}
.btn:hover { border-color: var(--accent); color: var(--accent-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }

.warnband {
  display: flex; gap: 12px; align-items: flex-start;
  border: 1px solid color-mix(in srgb, var(--amber) 38%, transparent);
  background: var(--amber-wash); border-radius: var(--r-md); padding: 14px 16px;
}
.warnband .g { font-family: var(--mono); color: var(--amber); font-size: 13px; }
.warnband p { font-size: 13.5px; color: var(--ink-2); }
.warnband b { color: var(--amber); }

.opaque { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
.redacted {
  display: inline-block; background: var(--card-3); color: transparent; border-radius: 3px;
  padding: 0 6px; user-select: none;
}

/* ---------- mobile capture mockups ---------- */
.phones { display: flex; gap: 34px; flex-wrap: wrap; }
.phone {
  width: 320px; flex: 0 0 320px; border: 1px solid var(--rule-2); border-radius: 26px;
  background: var(--card); padding: 12px; box-shadow: var(--shadow-lift);
}
.phone-screen {
  background: var(--paper); border-radius: 18px; padding: 16px 15px 18px; min-height: 560px;
  display: flex; flex-direction: column; gap: 14px;
}
.phone-status {
  display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px;
  color: var(--ink-3); letter-spacing: .06em;
}
.notif {
  background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 11px 13px;
  box-shadow: var(--shadow); display: flex; gap: 10px; align-items: flex-start;
}
.notif .src { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
              color: var(--ink-3); display: block; }
.notif p { font-size: 13px; margin-top: 2px; }

.slider-row { display: flex; flex-direction: column; gap: 5px; }
.slider-row .top { display: flex; justify-content: space-between; align-items: baseline; }
.slider-row .lbl { font-size: 13.5px; color: var(--ink-2); }
.slider-row .val { font-family: var(--mono); font-size: 13px; color: var(--ink); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.seg { display: flex; gap: 6px; }
.seg button {

  font-size: 13px; color: var(--ink-2); background: var(--card);

.seg button[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-2); }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.check {

  text-align: left;
}
.check[aria-pressed="true"] { border-color: var(--clay); background: var(--clay-wash); color: var(--clay); }
.check .box { width: 12px; height: 12px; border: 1.5px solid currentColor; border-radius: 3px; flex: 0 0 auto; }
.check[aria-pressed="true"] .box { background: currentColor; }
textarea.note {
  width: 100%; border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 9px 10px;
  font-family: var(--serif); font-size: 14px; background: var(--card); color: var(--ink); resize: vertical;
}
.mic {
  display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1px solid var(--rule);
  border-radius: var(--r-sm); background: var(--card); width: 100%;
}
.mic .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--clay); flex: 0 0 auto; }
.mic .t { font-size: 13px; color: var(--ink-2); }
.mic .num { margin-left: auto; font-size: 12px; color: var(--ink-3); }

.phone-caption { max-width: 320px; margin-top: 12px; font-size: 13px; color: var(--ink-3); line-height: 1.5; }

/* ---------- day-state segmented control ---------- */

}
.daystate button:last-child { border-right: 0; }
.daystate button[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent-2); font-weight: 600; }

.divider { height: 1px; background: var(--rule); border: 0; margin: 4px 0; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tight { line-height: 1.4; }
.center { text-align: center; }
.crumb {

}
.crumb:hover { color: var(--accent-2); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); }

<script>
/* =============================================================================
   Trading Journal v1 — prototype application

   Reads window.JOURNAL (generated by scripts/build_synthetic.py from the SQLite
   database) and renders the eight specified screens. No framework, no network,
   no build step: open index.html.

   Everything on screen is synthetic placeholder data.
   ============================================================================= */
(function () {
  "use strict";

  var D = window.JOURNAL;
  var ET_OFFSET_MS = 4 * 3600 * 1000; // stored UTC -> America/New_York wall clock (EDT)

  /* ------------------------------------------------------------------ format */
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July",
                "August", "September", "October", "November", "December"];
  var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MINUS = "−";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function etDate(iso) {
    if (!iso) return null;
    return new Date(Date.parse(iso) - ET_OFFSET_MS);
  }
  function etTime(iso) {
    var d = etDate(iso);
    return d ? pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()) : "";
  }
  function dayName(ymd) {
    var p = ymd.split("-");
    return DAYS[new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay()];
  }
  function longDate(ymd) {
    var p = ymd.split("-");
    return dayName(ymd) + " " + (+p[2]) + " " + MONTHS[+p[1] - 1] + " " + p[0];
  }
  function shortDate(ymd) {
    var p = ymd.split("-");
    return (+p[2]) + " " + MONTHS[+p[1] - 1].slice(0, 3);
  }

  function sgn(v) { return v == null ? "flat" : (v > 0.0001 ? "pos" : (v < -0.0001 ? "neg" : "flat")); }
  function cls(v) { return "v-" + sgn(v); }

  function fmtR(v, dp) {
    if (v == null) return "—";
    var n = Math.abs(v).toFixed(dp == null ? 2 : dp);
    return (v > 0.0001 ? "+" : v < -0.0001 ? MINUS : "") + n + "R";
  }
  function fmtMoney(v) {
    if (v == null) return "—";
    var n = Math.abs(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (v > 0.0001 ? "+" : v < -0.0001 ? MINUS : "") + "$" + n;
  }
  function fmtNum(v, dp) { return v == null ? "—" : Number(v).toFixed(dp == null ? 1 : dp); }
  function fmtPx(v) { return v == null ? "—" : Number(v).toFixed(2); }
  function fmtDur(s) {
    if (s == null) return "—";
    var m = Math.round(s / 60);
    return m >= 60 ? Math.floor(m / 60) + "h " + (m % 60) + "m" : m + "m";
  }
  /* Outcome words. Colour is never the only carrier — every signed number is
     paired with its sign, and every state chip carries a word. */
  /* Rounded to the displayed precision first, so a 0.002 rounding residue never
     renders as "+0.00R, discretion added". */
  function deltaR(actual, mech) {
    if (actual == null || mech == null) return null;
    return Math.round((actual - mech) * 100) / 100;
  }
  function deltaWord(d) {
    if (d == null) return "no reference";
    if (Math.abs(d) < 0.005) return "matched the rules";
    return d > 0 ? "discretion added" : "discretion cost";
  }
  function outcomeWord(r) { return r == null ? "no result" : r > 0.0001 ? "gain" : r < -0.0001 ? "loss" : "scratch"; }

  /* deterministic PRNG so generated chart paths never move between renders */
  function seeded(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return function () {
      h += 0x6D2B79F5; var t = h;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ------------------------------------------------------------------ data access */
  var SESSIONS = D.sessions.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var BY_DATE = {};
  var TRADES = [];
  SESSIONS.forEach(function (s) {
    BY_DATE[s.date] = s;
    s.trades.forEach(function (t) { t._session = s; TRADES.push(t); });
  });
  var TRADE_BY_UID = {};
  TRADES.forEach(function (t) { TRADE_BY_UID[t.trade_uid] = t; });
  var TODAY = D.meta.today;
  var TAXONOMY = {};
  D.mistake_taxonomy.forEach(function (m) { TAXONOMY[m.code] = m; });

  function tagLabel(code) { return TAXONOMY[code] ? TAXONOMY[code].label : code; }
  function m(s) { return s.metrics || {}; }

  function weeksDesc() {
    var seen = [];
    SESSIONS.forEach(function (s) { if (seen.indexOf(s.iso_week) < 0) seen.push(s.iso_week); });
    return seen.reverse();
  }
  function monthsDesc() {
    var seen = [];
    SESSIONS.forEach(function (s) { if (seen.indexOf(s.iso_month) < 0) seen.push(s.iso_month); });
    return seen.reverse();
  }
  function sessionsIn(key, field) {
    return SESSIONS.filter(function (s) { return s[field] === key; });
  }

  function aggregate(list) {
    var a = {
      sessions: list.length, trades: 0, wins: 0, losses: 0, r: 0, net: 0,
      opps: 0, taken: 0, missed: 0, mech: 0, uva: 0, mistakes: 0,
      process: [], adherence: [], grossWin: 0, grossLoss: 0, maxDD: 0, noTrade: 0
    };
    var run = 0, peak = 0;
    list.forEach(function (s) {
      var mm = m(s);
      a.trades += mm.trade_count || 0;
      a.wins += mm.win_count || 0;
      a.losses += mm.loss_count || 0;
      a.r += mm.total_r || 0;
      a.net += mm.net_pnl || 0;
      a.opps += mm.opportunities_total || 0;
      a.taken += mm.opportunities_taken || 0;
      a.missed += mm.opportunities_missed || 0;
      a.mech += mm.mechanical_r || 0;
      a.uva += mm.user_value_added_r || 0;
      a.mistakes += mm.mistake_count || 0;
      if (mm.process_score != null) a.process.push(mm.process_score);
      if (mm.rule_adherence != null) a.adherence.push(mm.rule_adherence);
      if (!mm.trade_count) a.noTrade++;
      s.trades.forEach(function (t) {
        if (t.r_multiple > 0) a.grossWin += t.r_multiple;
        else a.grossLoss += Math.abs(t.r_multiple || 0);
      });
      run += mm.total_r || 0;
      peak = Math.max(peak, run);
      a.maxDD = Math.min(a.maxDD, run - peak);
    });
    a.avgProcess = a.process.length ? a.process.reduce(function (x, y) { return x + y; }, 0) / a.process.length : null;
    a.avgAdherence = a.adherence.length ? a.adherence.reduce(function (x, y) { return x + y; }, 0) / a.adherence.length : null;
    a.expectancy = a.trades ? a.r / a.trades : null;
    a.pf = a.grossLoss > 0 ? a.grossWin / a.grossLoss : null;
    a.winRate = a.trades ? (a.wins / a.trades) * 100 : null;
    a.takeRate = a.opps ? (a.taken / a.opps) * 100 : null;
    return a;
  }

  /* ------------------------------------------------------------------ components */
  function stat(k, v, sub, klass) {
    return '<div class="stat"><span class="k">' + esc(k) + '</span>' +
      '<span class="v ' + (klass || "") + '">' + v + "</span>" +
      (sub ? '<span class="s">' + sub + "</span>" : "") + "</div>";
  }

  function dial(score, label) {
    if (score == null) return "";
    var r = 26, c = 2 * Math.PI * r, on = c * (score / 100);
    return '<div class="dial">' +
      '<svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Process score ' +
        fmtNum(score, 0) + ' out of 100">' +
      '<circle cx="32" cy="32" r="' + r + '" fill="none" stroke="var(--card-3)" stroke-width="5"/>' +
      '<circle cx="32" cy="32" r="' + r + '" fill="none" stroke="var(--accent)" stroke-width="5" ' +
        'stroke-linecap="round" stroke-dasharray="' + on.toFixed(1) + " " + c.toFixed(1) + '" ' +
        'transform="rotate(-90 32 32)"/></svg>' +
      '<div><div class="dial-v">' + fmtNum(score, 0) + '<span class="muted" style="font-size:13px">/100</span></div>' +
      '<div class="dial-l">' + esc(label || "Process score") + "</div></div></div>";
  }

  function pips(n, max, warm) {
    var out = '<span class="pips">';
    for (var i = 1; i <= (max || 5); i++) {
      out += '<span class="pip' + (i <= n ? " on" + (warm ? " warm" : "") : "") + '"></span>';
    }
    return out + "</span>";
  }

  function rating(label, value, warm) {
    if (value == null) return "";
    return '<div class="rating"><span class="lbl">' + esc(label) + "</span>" +
      '<span class="row" style="gap:8px">' + pips(value, 5, warm) +
      '<span class="n">' + value + "/5</span></span></div>";
  }

  function tagChips(tags) {
    if (!tags || !tags.length) return '<span class="chip chip-ghost">no flags</span>';
    return tags.map(function (t) {
      return '<span class="chip chip-flag" title="' + esc((TAXONOMY[t] || {}).description || "") + '">' +
        esc(tagLabel(t)) + "</span>";
    }).join(" ");
  }

  var OPP_WORDS = {
    TAKEN: ["taken", "chip-accent"], BOT_EXECUTED: ["bot executed", "chip-accent"],
    MISSED: ["missed", "chip-watch"], BOT_FAILED: ["bot failed", "chip-flag"],
    SKIPPED_BY_RULE: ["skipped by rule", "chip"], SKIPPED_DISCRETIONARY: ["skipped by choice", "chip"],
    INVALIDATED: ["invalidated", "chip"], NO_ACTION: ["no action", "chip"]
  };
  function oppChip(status) {
    var w = OPP_WORDS[status] || [status.toLowerCase(), "chip"];
    return '<span class="chip ' + (w[1] === "chip" ? "chip-ghost" : w[1]) + '">' + esc(w[0]) + "</span>";
  }

  /* ------------------------------------------------------------------ charts */

  /* Synthetic intrabar path. Production replaces this with the captured chart
     image referenced by media_asset; the geometry (entry/stop/target/MFE/MAE)
     is identical either way. */
  function pricePath(t, n) {
    var rand = seeded(t.trade_uid), dir = t.side === "long" ? 1 : -1;
    var risk = Math.abs(t.avg_entry_price - t.initial_stop) || 4;
    var mfe = t.mfe_r == null ? 0.6 : t.mfe_r, mae = t.mae_r == null ? -0.4 : t.mae_r;
    var rr = t.r_multiple == null ? 0 : t.r_multiple;
    var pre = Math.round(n * 0.22), post = Math.round(n * 0.18);
    var hold = n - pre - post;
    var pts = [], i;

    var p = t.avg_entry_price - dir * risk * (0.35 + rand() * 0.3);
    for (i = 0; i < pre; i++) {
      p += (t.avg_entry_price - p) * 0.28 + (rand() - 0.5) * risk * 0.16;
      pts.push(p);
    }
    pts.push(t.avg_entry_price);

    // order the excursions so the path is legible: adverse first on winners,
    // favourable first on losers — the usual shape of a trade that works or doesn't.
    var legs = rr >= 0
      ? [[0.30, mae], [0.72, mfe], [1.0, rr]]
      : [[0.34, mfe], [0.78, mae], [1.0, rr]];
    var prevIdx = 0, prevR = 0, mfeIdx = 0, maeIdx = 0, best = -1e9, worst = 1e9;
    legs.forEach(function (leg) {
      var idx = Math.max(1, Math.round(hold * leg[0]));
      for (var k = prevIdx + 1; k <= idx; k++) {
        var f = (k - prevIdx) / (idx - prevIdx);
        var rv = prevR + (leg[1] - prevR) * (f * f * (3 - 2 * f));
        pts.push(t.avg_entry_price + dir * risk * rv + (rand() - 0.5) * risk * 0.1);
      }
      prevIdx = idx; prevR = leg[1];
    });
    var entryIdx = pre, exitIdx = pts.length - 1;
    for (i = entryIdx; i <= exitIdx; i++) {
      var rel = (pts[i] - t.avg_entry_price) * dir;
      if (rel > best) { best = rel; mfeIdx = i; }
      if (rel < worst) { worst = rel; maeIdx = i; }
    }
    p = pts[pts.length - 1];
    for (i = 0; i < post; i++) {
      p += (rand() - 0.5) * risk * 0.3;
      pts.push(p);
    }
    return { pts: pts, entryIdx: entryIdx, exitIdx: exitIdx, mfeIdx: mfeIdx, maeIdx: maeIdx };
  }

  function tradeChart(t, opts) {
    opts = opts || {};
    var W = opts.w || 216, H = opts.h || 132, P = opts.pad || (opts.big ? 34 : 8);
    var path = pricePath(t, opts.big ? 150 : 70);
    var vals = path.pts.concat([t.initial_stop, t.initial_target, t.avg_entry_price]).filter(function (v) { return v != null; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var span = (hi - lo) || 1;
    lo -= span * 0.1; hi += span * 0.1; span = hi - lo;
    var x = function (i) { return P + (i / (path.pts.length - 1)) * (W - P * 2 - (opts.big ? 46 : 0)); };
    var y = function (v) { return H - P - ((v - lo) / span) * (H - P * 2); };
    var line = path.pts.map(function (v, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); }).join(" ");

    function ref(v, colour, dash, label) {
      if (v == null) return "";
      return '<line x1="' + x(0) + '" x2="' + x(path.pts.length - 1) + '" y1="' + y(v).toFixed(1) +
        '" y2="' + y(v).toFixed(1) + '" stroke="' + colour + '" stroke-width="1"' +
        (dash ? ' stroke-dasharray="' + dash + '"' : "") + ' opacity="' + (opts.big ? 0.85 : 0.6) + '"/>' +
        (opts.big && label
          ? '<text class="axis-label" x="' + (x(path.pts.length - 1) + 6) + '" y="' + (y(v) + 3).toFixed(1) +
            '" fill="' + colour + '">' + esc(label) + "</text>"
          : "");
    }

    var band = '<rect x="' + x(path.entryIdx).toFixed(1) + '" y="' + P + '" width="' +
      Math.max(1, x(path.exitIdx) - x(path.entryIdx)).toFixed(1) + '" height="' + (H - P * 2) +
      '" fill="var(--accent)" opacity="0.06"/>';

    var marks =
      '<circle cx="' + x(path.entryIdx).toFixed(1) + '" cy="' + y(path.pts[path.entryIdx]).toFixed(1) +
        '" r="' + (opts.big ? 5 : 3.4) + '" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>' +
      '<circle cx="' + x(path.exitIdx).toFixed(1) + '" cy="' + y(path.pts[path.exitIdx]).toFixed(1) +
        '" r="' + (opts.big ? 5 : 3.4) + '" fill="' + (t.r_multiple >= 0 ? "var(--accent)" : "var(--clay)") +
        '" stroke="var(--card)" stroke-width="2"/>';

    /* Label each excursion on the side away from the entry line, so the text
       never lands on the price path it is annotating. */
    function excursion(idx, label) {
      var px = x(idx), py = y(path.pts[idx]);
      var away = py <= y(t.avg_entry_price) ? -9 : 16;
      return '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) +
        '" r="3.5" fill="none" stroke="var(--ink-3)" stroke-width="1.5"/>' +
        '<text class="axis-label" x="' + (px + 8).toFixed(1) + '" y="' + (py + away).toFixed(1) +
        '">' + label + "</text>";
    }
    var excursions = opts.big
      ? excursion(path.mfeIdx, "MFE " + fmtR(t.mfe_r)) + excursion(path.maeIdx, "MAE " + fmtR(t.mae_r))
      : "";

    return '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="' +
      esc(t.strategy_id + " " + t.side + ", result " + fmtR(t.r_multiple) + ", " + outcomeWord(t.r_multiple)) +
      '">' + band +
      ref(t.initial_stop, "var(--clay)", "3 3", "Stop " + fmtPx(t.initial_stop)) +
      ref(t.initial_target, "var(--ink-3)", "3 3", "Target " + fmtPx(t.initial_target)) +
      ref(t.avg_entry_price, "var(--ink-3)", "", "Entry " + fmtPx(t.avg_entry_price)) +
      '<path class="series-line" d="' + line + '"/>' + marks + excursions + "</svg>";
  }

  /* Single-series cumulative-R curve with crosshair + tooltip. */
  function equityCurve(list, opts) {
    opts = opts || {};
    var W = 720, H = opts.h || 190, L = 40, R = 16, T = 14, B = 26;
    var run = 0, pts = list.map(function (s) {
      run += m(s).total_r || 0;
      return { date: s.date, v: run, session: s };
    });
    if (!pts.length) return '<p class="muted small">No sessions in this period.</p>';
    var lo = Math.min(0, Math.min.apply(null, pts.map(function (p) { return p.v; })));
    var hi = Math.max(0.5, Math.max.apply(null, pts.map(function (p) { return p.v; })));
    var span = (hi - lo) || 1;
    lo -= span * 0.12; hi += span * 0.12; span = hi - lo;
    var x = function (i) { return L + (pts.length === 1 ? 0.5 : i / (pts.length - 1)) * (W - L - R); };
    var y = function (v) { return T + (1 - (v - lo) / span) * (H - T - B); };

    var line = pts.map(function (p, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1); }).join(" ");
    var area = line + " L" + x(pts.length - 1).toFixed(1) + " " + y(Math.max(lo, 0)).toFixed(1) +
      " L" + x(0).toFixed(1) + " " + y(Math.max(lo, 0)).toFixed(1) + " Z";

    var ticks = "";
    [hi - span * 0.12, (hi + lo) / 2, lo + span * 0.12].forEach(function (v) {
      ticks += '<line class="grid-line" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) +
        '" y2="' + y(v).toFixed(1) + '"/><text class="axis-label" x="6" y="' + (y(v) + 3).toFixed(1) + '">' +
        fmtR(v, 1) + "</text>";
    });
    var zero = (lo < 0 && hi > 0)
      ? '<line class="zero-line" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0).toFixed(1) +
        '" y2="' + y(0).toFixed(1) + '" stroke-dasharray="2 3"/>' : "";

    var labels = '<text class="axis-label" x="' + L + '" y="' + (H - 8) + '">' + esc(shortDate(pts[0].date)) +
      '</text><text class="axis-label" x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end">' +
      esc(shortDate(pts[pts.length - 1].date)) + "</text>";

    var hot = pts.map(function (p, i) {
      return '<rect class="hot" x="' + (x(i) - (W - L - R) / (2 * Math.max(1, pts.length - 1))).toFixed(1) +
        '" y="' + T + '" width="' + ((W - L - R) / Math.max(1, pts.length - 1)).toFixed(1) + '" height="' +
        (H - T - B) + '" fill="transparent" data-cx="' + x(i).toFixed(1) + '" data-cy="' + y(p.v).toFixed(1) +
        '" data-label="' + esc(shortDate(p.date) + " · " + fmtR(p.v) + " cumulative") + '"/>';
    }).join("");

    return '<figure class="chart-wrap" data-chart="equity">' +
      '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Cumulative R, ' +
        esc(shortDate(pts[0].date)) + " to " + esc(shortDate(pts[pts.length - 1].date)) + ', ending ' +
        fmtR(pts[pts.length - 1].v) + '">' + ticks + zero +
      '<path class="series-area" d="' + area + '"/><path class="series-line" d="' + line + '"/>' +
      '<circle class="series-end" cx="' + x(pts.length - 1).toFixed(1) + '" cy="' +
        y(pts[pts.length - 1].v).toFixed(1) + '" r="4.5"/>' +
      '<line class="cross" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) +
        '" stroke="var(--rule-2)" stroke-width="1" opacity="0"/>' + labels + hot + "</svg>" +
      '<div class="tooltip"></div>' +
      '<figcaption class="chart-cap">Cumulative R across the period. Ends at <span class="num ' +
        cls(pts[pts.length - 1].v) + '">' + fmtR(pts[pts.length - 1].v) + "</span>.</figcaption></figure>";
  }

  /* Per-session R bars. Diverging by polarity: accent above zero, clay below,
     with a neutral zero rule; the sign in the tooltip carries the meaning too. */
  function dailyBars(list, opts) {
    opts = opts || {};
    var W = 720, H = opts.h || 130, L = 34, R = 10, T = 10, B = 22;
    if (!list.length) return "";
    var vals = list.map(function (s) { return m(s).total_r || 0; });
    var hi = Math.max(1, Math.max.apply(null, vals)), lo = Math.min(-1, Math.min.apply(null, vals));
    var span = hi - lo;
    var y0 = T + (hi / span) * (H - T - B);
    var bw = (W - L - R) / list.length;
    var bars = list.map(function (s, i) {
      var v = m(s).total_r || 0;
      var h = Math.abs(v / span) * (H - T - B);
      var xx = L + i * bw + bw * 0.18, w = bw * 0.64;
      var yy = v >= 0 ? y0 - h : y0;
      var lbl = shortDate(s.date) + " · " + fmtR(v) + " · " + outcomeWord(v);
      return '<rect class="' + (v >= 0 ? "bar-pos" : "bar-neg") + '" x="' + xx.toFixed(1) + '" y="' +
        yy.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(1.5, h).toFixed(1) +
        '" rx="2" data-cx="' + (xx + w / 2).toFixed(1) + '" data-cy="' + yy.toFixed(1) +
        '" data-label="' + esc(lbl) + '"/>';
    }).join("");
    return '<figure class="chart-wrap" data-chart="bars">' +
      '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="R by session">' +
      '<text class="axis-label" x="4" y="' + (T + 6) + '">' + fmtR(hi, 1) + "</text>" +
      '<text class="axis-label" x="4" y="' + (H - B + 4) + '">' + fmtR(lo, 1) + "</text>" +
      '<line class="zero-line" x1="' + L + '" x2="' + (W - R) + '" y1="' + y0.toFixed(1) +
        '" y2="' + y0.toFixed(1) + '"/>' + bars + "</svg><div class=\"tooltip\"></div>" +
      '<figcaption class="chart-cap">R by session. Bars above the rule are gains, below are losses; ' +
      'every value is signed.</figcaption></figure>';
  }

  function hbars(rows, opts) {
    opts = opts || {};
    var max = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.value); }).concat([0.0001]));
    return '<div class="stack-sm">' + rows.map(function (r) {
      var w = (Math.abs(r.value) / max) * 100;
      return '<div class="hbar"><span class="lbl">' + esc(r.label) + "</span>" +
        '<span class="track"><span class="fill' + (r.warm ? " warm" : "") + '" style="width:' +
        w.toFixed(1) + '%"></span></span><span class="val ' + (opts.plain ? "" : cls(r.value)) + '">' +
        (r.display != null ? r.display : fmtNum(r.value, 1)) + "</span></div>";
    }).join("") + "</div>";
  }

  /* ------------------------------------------------------------------ shared blocks */
  function tradeCard(t, opts) {
    opts = opts || {};
    var mech = t.mechanical_r;
    var delta = deltaR(t.r_multiple, mech);
    return '<a class="trade-card" href="#/trade/' + t.trade_uid + '">' +
      '<div class="trade-chart">' + tradeChart(t) + "</div>" +
      '<div class="trade-main">' +
        '<div class="trade-title"><h3>' + esc(t.strategy_id.replace(/_/g, " ")) + " " +
          esc(t.side) + "</h3>" +
          '<span class="chip chip-ghost">' + esc(t.symbol) + "</span>" +
          '<span class="chip chip-ghost">' + esc(t.execution_mode.replace("_", "-")) + "</span>" +
          '<span style="margin-left:auto;white-space:nowrap">' +
            '<span class="num ' + cls(t.r_multiple) + '" style="font-size:19px">' + fmtR(t.r_multiple) + "</span> " +
            '<span class="muted small">' + outcomeWord(t.r_multiple) + "</span></span></div>" +
        '<div class="kv">' +
          '<div><span class="k">Entry</span><span class="v">' + etTime(t.entry_at) + " · " + fmtPx(t.avg_entry_price) + "</span></div>" +
          '<div><span class="k">Exit</span><span class="v">' + etTime(t.exit_at) + " · " + fmtPx(t.avg_exit_price) + "</span></div>" +
          '<div><span class="k">MFE / MAE</span><span class="v">' + fmtR(t.mfe_r, 1) + " / " + fmtR(t.mae_r, 1) + "</span></div>" +
          '<div><span class="k">Held</span><span class="v">' + fmtDur(t.holding_seconds) + "</span></div>" +
          '<div><span class="k">Mechanical</span><span class="v">' + fmtR(mech) + "</span></div>" +
          '<div><span class="k">vs mechanical</span><span class="v ' + cls(delta) + '">' + fmtR(delta) + "</span></div>" +
        "</div>" +
        '<div class="row">' + tagChips(t.tags) + "</div>" +
        (t.execution_note ? '<p class="trade-note">' + esc(t.execution_note) + "</p>" : "") +
      "</div></a>";
  }

  function oppRow(o) {
    return '<div class="rating"><span class="lbl">' +
      '<span class="num muted" style="font-size:12px">' + etTime(o.qualified_at) + "</span> &nbsp;" +
      esc(o.strategy_id.replace(/_/g, " ")) + " " + esc(o.direction) +
      (o.status_reason ? '<br><span class="muted small">' + esc(o.status_reason) + "</span>" : "") +
      "</span>" +
      '<span class="row" style="gap:10px">' + oppChip(o.status) +
      '<span class="num muted" style="font-size:12.5px" title="Mechanical reference result">' +
      fmtR(o.mechanical_r) + "</span></span></div>";
  }

  function provenance(kind, meta) {
    return '<div class="prov"><span>' + esc(kind) + "</span>" +
      Object.keys(meta).map(function (k) { return "<span><b>" + esc(k) + "</b> " + esc(meta[k]) + "</span>"; }).join("") +
      "</div>";
  }

  /* ------------------------------------------------------------------ view: TODAY */
  var dayState = "after";

  function viewToday() {
    var s = BY_DATE[TODAY] || SESSIONS[SESSIONS.length - 1];
    var cut = dayState === "pre" ? "09:29" : dayState === "mid" ? "11:30" : "23:59";
    var trades = s.trades.filter(function (t) { return etTime(t.entry_at) <= cut; });
    var opps = s.opportunities.filter(function (o) { return etTime(o.qualified_at) <= cut; });
    var mm = m(s);
    var live = trades.reduce(function (a, t) { return a + (t.r_multiple || 0); }, 0);
    var liveNet = trades.reduce(function (a, t) { return a + (t.net_pnl || 0); }, 0);
    var riskUsed = trades.reduce(function (a, t) { return a + Math.max(0, -(t.r_multiple || 0)); }, 0);
    var limit = s.planned_max_risk_r || 2;

    var head = '<div class="page-head"><div class="grow">' +
      '<span class="eyebrow">' + esc(longDate(s.date)) + " · session " + esc(s.session_uid) + "</span>" +
      "<h1>Today</h1>" +
      '<p class="page-sub">' +
        (dayState === "pre" ? "Checked in. Market opens in 18 minutes."
          : dayState === "mid" ? "Session in progress."
          : "Session closed. Check-out submitted at " + etTime(s.post ? s.post.submitted_at : null) + ".") +
      "</p></div>" +
      '<div class="daystate" role="group" aria-label="View the day at a point in time">' +
        ["pre", "mid", "after"].map(function (k) {
          return '<button data-daystate="' + k + '" aria-pressed="' + (dayState === k) + '">' +
            { pre: "Before open", mid: "Mid-session", after: "After close" }[k] + "</button>";
        }).join("") +
      "</div></div>";

    /* --- the morning card is the same object in all three states, it just
           stops being the headline once the session starts --- */
    var pre = s.pre || {};
    var checkin = '<section class="card"><div class="card-head"><span class="eyebrow">Morning check-in</span>' +
      '<span class="muted small num">' + (pre.fill_seconds || 0) + "s to complete</span></div>" +
      '<div class="grid g-fit" style="gap:22px"><div class="stack-sm">' +
        rating("Energy", pre.energy) + rating("Focus", pre.focus) +
        rating("Stress", pre.stress, true) + rating("Desire to trade", pre.desire_to_trade) +
      '</div><div class="stack-sm">' +
        '<div class="rating"><span class="lbl">Sleep</span><span class="num">' + fmtNum(pre.sleep_hours, 1) + " h</span></div>" +
        '<div class="rating"><span class="lbl">Bias</span><span class="num">' + esc(pre.bias || "—") + "</span></div>" +
        '<div class="rating"><span class="lbl">Planned risk</span><span class="num">' + fmtNum(limit, 1) + "R max</span></div>" +
        '<div class="rating"><span class="lbl">Daily loss limit</span><span class="num">$' + fmtNum(s.daily_loss_limit, 0) + "</span></div>" +
      "</div></div>" +
      '<div class="reflect" style="margin-top:16px"><div class="reflect-item">' +
        '<span class="k">A well-traded day today means</span>' +
        '<span class="t">' + esc(pre.well_traded_definition || "—") + "</span></div>" +
        (pre.note ? '<div class="reflect-item"><span class="k">Note</span><span class="t">' + esc(pre.note) + "</span></div>" : "") +
      "</div></section>";

    var statBlock;
    if (dayState === "pre") {
      statBlock = '<div class="stats stats-4">' +
        stat("Session", "Planned", "opens 09:30 ET", "sm") +
        stat("Risk budget", fmtNum(limit, 1) + "R", "not yet used", "sm") +
        stat("Strategies", "2", "10AM Model, DORB", "sm") +
        stat("Trades", "0", "before the open", "sm") + "</div>";
    } else {
      statBlock = '<div class="stats stats-4">' +
        stat("Net P&L", fmtMoney(liveNet), (dayState === "mid" ? "so far · " : "") + outcomeWord(liveNet), cls(liveNet)) +
        stat("R", fmtR(live), trades.length + (trades.length === 1 ? " trade" : " trades")) +
        stat("Risk used", fmtNum(riskUsed, 1) + "R", "of " + fmtNum(limit, 1) + "R planned", "sm") +
        stat("Qualified setups", String(opps.length),
             opps.filter(function (o) { return o.status === "MISSED"; }).length + " missed", "sm") + "</div>";
    }

    var left = "", right = "";

    if (dayState === "pre") {
      left = checkin + planCard(s);
      right = marketCard(s, true) + remindersCard(dayState);
    } else if (dayState === "mid") {
      left = '<section class="card"><div class="card-head"><span class="eyebrow">Trades so far</span>' +
        '<a class="crumb" href="#/session/' + s.date + '">full session review →</a></div>' +
        (trades.length ? '<div class="stack">' + trades.map(function (t) { return tradeCard(t); }).join("") + "</div>"
                       : '<p class="muted">No trades yet.</p>') + "</section>" +
        oppCard(opps);
      right = riskCard(riskUsed, limit, s) + checkin;
    } else {
      left = '<section class="card"><div class="card-head"><span class="eyebrow">Trades</span>' +
        '<a class="crumb" href="#/session/' + s.date + '">full session review →</a></div>' +
        (trades.length ? '<div class="stack">' + trades.map(function (t) { return tradeCard(t); }).join("") + "</div>"
                       : '<p class="muted">No trades taken.</p>') + "</section>" +
        oppCard(opps) + reflectionCard(s);
      right = '<section class="card"><div class="card-head"><span class="eyebrow">How the day scored</span></div>' +
        dial(mm.process_score) +
        '<p class="small muted" style="margin-top:12px">Process score contains no P&amp;L term. ' +
        "It is rule adherence, execution, patience, emotional control and plan conformance.</p>" +
        '<hr class="divider" style="margin:16px 0">' +
        '<div class="stack-sm">' +
          rating("Execution quality", (s.post || {}).execution_quality) +
          rating("Rule adherence", (s.post || {}).rule_adherence) +
          rating("Patience", (s.post || {}).patience) +
          rating("Emotional control", (s.post || {}).emotional_control) +
        "</div></section>" + narrativeCard(s) + checkin;
    }

    return head + statBlock + '<div class="grid g-main" style="margin-top:22px">' +
      '<div class="stack">' + left + '</div><div class="stack">' + right + "</div></div>";
  }

  function planCard(s) {
    var strat = {};
    s.opportunities.forEach(function (o) { strat[o.strategy_id] = true; });
    return '<section class="card"><div class="card-head"><span class="eyebrow">Session plan</span></div>' +
      '<div class="kv" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">' +
      '<div><span class="k">Account</span><span class="v">Eval 50k</span></div>' +
      '<div><span class="k">Mode</span><span class="v">' + esc(s.mode) + "</span></div>" +
      '<div><span class="k">Max risk</span><span class="v">' + fmtNum(s.planned_max_risk_r, 1) + "R</span></div>" +
      '<div><span class="k">Loss limit</span><span class="v">$' + fmtNum(s.daily_loss_limit, 0) + "</span></div>" +
      "</div><hr class=\"divider\" style=\"margin:16px 0\">" +
      '<span class="eyebrow">Planned strategies</span><div class="row">' +
      Object.keys(strat).map(function (k) { return '<span class="chip chip-accent">' + esc(k.replace(/_/g, " ")) + "</span>"; }).join("") +
      "</div></section>";
  }

  function riskCard(used, limit, s) {
    var pct = Math.min(100, (used / limit) * 100);
    return '<section class="card"><div class="card-head"><span class="eyebrow">Risk against plan</span></div>' +
      '<div class="hbar"><span class="lbl">Risk used</span><span class="track">' +
      '<span class="fill' + (pct > 75 ? " warm" : "") + '" style="width:' + pct.toFixed(0) + '%"></span></span>' +
      '<span class="val">' + fmtNum(used, 1) + "R</span></div>" +
      '<p class="small muted" style="margin-top:10px">' + fmtNum(limit - used, 1) +
      "R of the planned budget remains. Daily loss limit $" + fmtNum(s.daily_loss_limit, 0) +
      " is enforced by the platform, not by this journal.</p></section>";
  }

  function oppCard(opps) {
    var missed = opps.filter(function (o) { return o.status === "MISSED"; });
    return '<section class="card"><div class="card-head"><span class="eyebrow">Qualified setups</span>' +
      '<span class="muted small">' + opps.length + " qualified · " + missed.length + " missed</span></div>" +
      (opps.length ? '<div class="stack-sm">' + opps.map(oppRow).join("") + "</div>"
                   : '<p class="muted">No setup qualified today.</p>') +
      '<p class="small muted" style="margin-top:12px">Every qualified setup is logged whether or not ' +
      "it was traded. The number on the right is what the mechanical rules would have produced.</p></section>";
  }

  function reflectionCard(s) {
    var p = s.post || {};
    var flags = [
      ["overtraded", "Overtraded"], ["revenge_trade", "Revenge trade"], ["stop_moved", "Stop moved"],
      ["oversized", "Oversized"], ["missed_qualified", "Missed a qualified setup"],
      ["manual_override", "Manual override"]
    ].filter(function (f) { return p[f[0]]; });
    return '<section class="card"><div class="card-head"><span class="eyebrow">Reflection</span>' +
      '<span class="chip ' + (p.well_traded === "yes" ? "chip-accent" : p.well_traded === "no" ? "chip-flag" : "chip-watch") +
      '">well traded: ' + esc(p.well_traded || "—") + "</span></div>" +
      '<div class="reflect">' +
      (p.best_decision ? '<div class="reflect-item"><span class="k">Best decision</span><span class="t">' + esc(p.best_decision) + "</span></div>" : "") +
      (p.biggest_mistake ? '<div class="reflect-item flag"><span class="k">Biggest mistake</span><span class="t">' + esc(p.biggest_mistake) + "</span></div>" : "") +
      (p.unusual_context ? '<div class="reflect-item"><span class="k">Unusual context</span><span class="t">' + esc(p.unusual_context) + "</span></div>" : "") +
      "</div>" +
      (flags.length ? '<div class="row" style="margin-top:14px">' + flags.map(function (f) {
        return '<span class="chip chip-flag">' + esc(f[1]) + "</span>"; }).join("") + "</div>" : "") +
      provenance("Written by you", { submitted: etTime(p.submitted_at) + " ET", took: (p.fill_seconds || 0) + "s" }) +
      "</section>";
  }

  function narrativeCard(s) {
    if (!s.narrative || !s.narrative.length) return "";
    var n = s.narrative[0];
    return '<section class="card"><div class="card-head"><span class="eyebrow">Daily summary</span>' +
      '<span class="chip chip-ghost">generated</span></div>' +
      '<div class="prose">' + n.text.split("\n\n").map(function (p) { return "<p>" + esc(p) + "</p>"; }).join('<p style="height:8px"></p>') + "</div>" +
      provenance("Generated summary — facts from the session record, not a rewrite of your words",
        { model: n.model, version: n.model_version, at: etTime(n.created_at) + " ET" }) + "</section>";
  }

  function marketCard(s, compact) {
    if (!s.market || !s.market.length) return "";
    var c = s.market[0];
    var ev = [];
    try { ev = JSON.parse(c.econ_events || "[]"); } catch (e) { ev = []; }
    var body = '<div class="kv" style="grid-template-columns:repeat(auto-fit,minmax(96px,1fr))">' +
      '<div><span class="k">Prior close</span><span class="v">' + fmtPx(c.prior_close) + "</span></div>" +
      '<div><span class="k">Gap</span><span class="v">' + (c.gap_points > 0 ? "+" : c.gap_points < 0 ? MINUS : "") + Math.abs(c.gap_points).toFixed(2) + "</span></div>" +
      '<div><span class="k">ATR(14)</span><span class="v">' + fmtNum(c.atr14, 1) + "</span></div>" +
      '<div><span class="k">Trend state</span><span class="v">' + esc(c.trend_state) + "</span></div>" +
      '<div><span class="k">O/N high</span><span class="v">' + fmtPx(c.overnight_high) + "</span></div>" +
      '<div><span class="k">O/N low</span><span class="v">' + fmtPx(c.overnight_low) + "</span></div>" +
      (compact ? "" :
      '<div><span class="k">Opening range</span><span class="v">' + fmtPx(c.opening_range_low) + "–" + fmtPx(c.opening_range_high) + "</span></div>" +
      '<div><span class="k">Session range</span><span class="v">' + fmtNum(c.session_range, 2) + "</span></div>") +
      "</div>" +
      (ev.length ? '<div class="row" style="margin-top:12px">' + ev.map(function (e) {
        return '<span class="chip chip-watch">' + esc(e.time + " " + e.name) + "</span>"; }).join("") + "</div>" : "");
    return '<section class="card"><div class="card-head"><span class="eyebrow">Market context</span>' +
      '<span class="muted small">measured, not felt</span></div>' + body +
      '<p class="small muted" style="margin-top:12px">These are objective values from the data feed. ' +
      'How the session <em>felt</em> lives in your notes, never here.</p></section>';
  }

  function remindersCard() {
    return '<section class="card"><div class="card-head"><span class="eyebrow">Today\'s prompts</span></div>' +
      '<div class="stack-sm">' +
      '<div class="rating"><span class="lbl">Pre-session check-in</span><span class="chip chip-accent">done 09:12</span></div>' +
      '<div class="rating"><span class="lbl">Post-session check-out</span><span class="chip chip-ghost">16:05 ET</span></div>' +
      '<div class="rating"><span class="lbl">Weekly review</span><span class="chip chip-ghost">Friday 16:30 ET</span></div>' +
      "</div><p class=\"small muted\" style=\"margin-top:12px\">Prompts are sent by a scheduled job on your machine, " +
      "not by an assistant that has to be running. See <a href=\"#/capture\">Capture</a>.</p></section>";
  }

  /* ------------------------------------------------------------------ view: SESSION */
  function viewSession(dateKey) {
    var s = BY_DATE[dateKey];
    if (!s) return '<div class="card">Session not found.</div>';
    var mm = m(s);
    var idx = SESSIONS.indexOf(s);
    var prev = SESSIONS[idx - 1], next = SESSIONS[idx + 1];

    var items = [];
    if (s.pre) items.push({ t: s.pre.submitted_at, kind: "checkin", title: "Pre-session check-in",
      meta: "energy " + s.pre.energy + "/5 · focus " + s.pre.focus + "/5 · stress " + s.pre.stress + "/5",
      detail: esc(s.pre.well_traded_definition || "") });
    s.events.forEach(function (e) {
      // check-ins and qualified-setup notices are already rendered from their
      // own records; the event log would duplicate them.
      if (/check-in|check-out|qualified/i.test(e.message)) return;
      items.push({ t: e.occurred_at, kind: e.level === "warn" ? "missed" : "event",
        title: e.message, meta: e.source });
    });
    s.opportunities.forEach(function (o) {
      if (o.status === "TAKEN" || o.status === "BOT_EXECUTED") return;
      items.push({ t: o.qualified_at, kind: o.status === "MISSED" ? "missed" : "event",
        title: o.strategy_id.replace(/_/g, " ") + " " + o.direction + " — " + (OPP_WORDS[o.status] || [o.status])[0],
        meta: "mechanical " + fmtR(o.mechanical_r),
        detail: esc(o.status_reason || "") });
    });
    s.trades.forEach(function (t) {
      items.push({ t: t.entry_at, kind: "trade",
        title: "Entry — " + t.strategy_id.replace(/_/g, " ") + " " + t.side + " ×" + t.quantity,
        meta: fmtPx(t.avg_entry_price) + " · stop " + fmtPx(t.initial_stop),
        detail: esc(t.execution_note || ""), href: "#/trade/" + t.trade_uid });
      items.push({ t: t.exit_at, kind: t.tags.length ? "flag" : "trade",
        title: "Exit — " + fmtR(t.r_multiple) + " " + outcomeWord(t.r_multiple),
        meta: t.exit_reason + " · held " + fmtDur(t.holding_seconds),
        detail: t.tags.length ? "Flagged: " + t.tags.map(tagLabel).join(", ") : "",
        href: "#/trade/" + t.trade_uid });
    });
    if (s.post) items.push({ t: s.post.submitted_at, kind: "checkin", title: "Post-session check-out",
      meta: "well traded: " + (s.post.well_traded || "—"),
      detail: esc(s.post.biggest_mistake || "") });
    items.sort(function (a, b) { return a.t < b.t ? -1 : 1; });

    var timeline = '<ul class="timeline">' + items.map(function (it, i) {
      var hasDetail = !!it.detail;
      return '<li class="tl-item" data-kind="' + it.kind + '">' +
        '<span class="tl-time">' + etTime(it.t) + '</span><span class="tl-dot"><i></i></span>' +
        '<div class="tl-body">' +
        (hasDetail
          ? '<button class="tl-toggle" data-tl="' + i + '" aria-expanded="false"><span class="tl-head">' +
            '<span class="tl-title">' + esc(it.title) + '</span><span class="tl-meta">' + esc(it.meta) + "</span></span></button>" +
            '<div class="tl-detail" id="tl-' + i + '" hidden>' + it.detail +
            (it.href ? ' <a class="crumb" href="' + it.href + '">open trade →</a>' : "") + "</div>"
          : '<span class="tl-head"><span class="tl-title">' + esc(it.title) + '</span>' +
            '<span class="tl-meta">' + esc(it.meta) + "</span></span>") +
        "</div></li>";
    }).join("") + "</ul>";

    var post = s.post || {}, pre = s.pre || {};

    return '<div class="page-head"><div class="grow">' +
      '<a class="crumb" href="#/calendar">← calendar</a>' +
      '<h1 style="margin-top:8px">' + esc(longDate(s.date)) + "</h1>" +
      '<p class="page-sub">' + esc(s.session_uid) + " · " + esc(s.mode) + " · " + esc(s.tz) + "</p></div>" +
      '<div class="row">' +
        (prev ? '<a class="btn" href="#/session/' + prev.date + '">← ' + esc(shortDate(prev.date)) + "</a>" : "") +
        (next ? '<a class="btn" href="#/session/' + next.date + '">' + esc(shortDate(next.date)) + " →</a>" : "") +
      "</div></div>" +

      '<section class="card" style="padding:0;overflow:hidden">' +
      '<div class="stats stats-4">' +
        stat("Net P&L", fmtMoney(mm.net_pnl), outcomeWord(mm.net_pnl), cls(mm.net_pnl)) +
        stat("R", fmtR(mm.total_r), (mm.trade_count || 0) + " trades · " + (mm.win_count || 0) + " winners") +
        stat("Process score", fmtNum(mm.process_score, 0), "no P&L in this number", "sm") +
        stat("Rule adherence", (mm.rule_adherence || "—") + "/5",
             (mm.mistake_count || 0) + (mm.mistake_count === 1 ? " flag" : " flags"), "sm") +
      "</div>" +
      '<div class="stats stats-3" style="border-top:1px solid var(--rule);border-radius:0">' +
        stat("Qualified setups", String(mm.opportunities_total || 0),
             (mm.opportunities_taken || 0) + " taken · " + (mm.opportunities_missed || 0) + " missed", "sm") +
        stat("Mechanical reference", fmtR(mm.mechanical_r), "what the rules alone produced", "sm") +
        stat("Your difference", fmtR(mm.user_value_added_r),
             (mm.user_value_added_r >= 0 ? "discretion added" : "discretion cost"), "sm " + cls(mm.user_value_added_r)) +
      "</div></section>" +

      (s.narrative && s.narrative.length ? '<div style="margin-top:22px">' + narrativeCard(s) + "</div>" : "") +

      '<div class="grid g-main" style="margin-top:22px"><div class="stack">' +
        '<section class="card"><div class="card-head"><span class="eyebrow">Timeline</span>' +
        '<span class="muted small">click an entry to expand</span></div>' + timeline + "</section>" +
        '<section class="card card-quiet" style="padding:0;border:0">' +
        '<div class="card-head"><span class="eyebrow">Trades</span></div>' +
        (s.trades.length ? '<div class="stack">' + s.trades.map(function (t) { return tradeCard(t); }).join("") + "</div>"
                         : '<p class="muted">No trades taken this session.</p>') + "</section>" +
        oppCard(s.opportunities) +
      "</div><div class=\"stack\">" +
        '<section class="card"><div class="card-head"><span class="eyebrow">How I traded</span></div>' +
        dial(mm.process_score) +
        '<hr class="divider" style="margin:16px 0">' +
        '<span class="eyebrow">Before the open</span><div class="stack-sm" style="margin-bottom:14px">' +
          rating("Energy", pre.energy) + rating("Focus", pre.focus) + rating("Stress", pre.stress, true) +
          '<div class="rating"><span class="lbl">Sleep</span><span class="num">' + fmtNum(pre.sleep_hours, 1) + " h</span></div>" +
        "</div>" +
        '<span class="eyebrow">After the close</span><div class="stack-sm">' +
          rating("Execution quality", post.execution_quality) +
          rating("Rule adherence", post.rule_adherence) +
          rating("Patience", post.patience) +
          rating("Emotional control", post.emotional_control) +
        "</div></section>" +
        reflectionCard(s) +
        voiceCard(s) +
        marketCard(s) +
      "</div></div>";
  }

  function voiceCard(s) {
    if (!s.voice || !s.voice.length) return "";
    var v = s.voice[0];
    return '<section class="card"><div class="card-head"><span class="eyebrow">Voice note</span>' +
      '<span class="muted small num">' + Math.round(v.duration_seconds) + "s</span></div>" +
      '<div class="mic" style="margin-bottom:12px"><span class="dot"></span>' +
      '<span class="t">Recorded at ' + etTime(v.recorded_at) + " ET</span>" +
      '<span class="num">audio kept</span></div>' +
      '<div class="quote">“' + esc(v.transcript) + "”</div>" +
      provenance("Your words, transcribed verbatim",
        { engine: v.transcript_engine, version: v.transcript_version, edited: "never" }) + "</section>";
  }

  /* ------------------------------------------------------------------ view: TRADE */
  function viewTrade(uid) {
    var t = TRADE_BY_UID[uid];
    if (!t) return '<div class="card">Trade not found.</div>';
    var s = t._session, mm = m(s);
    var delta = deltaR(t.r_multiple, t.mechanical_r);
    var mkt = (s.market && s.market[0]) || {};
    var accepted = (t.ai_suggestions || []).filter(function (a) { return a.status === "accepted"; });
    var rejected = (t.ai_suggestions || []).filter(function (a) { return a.status === "rejected"; });

    return '<div class="page-head"><div class="grow">' +
      '<a class="crumb" href="#/session/' + s.date + '">← ' + esc(longDate(s.date)) + "</a>" +
      "<h1 style=\"margin-top:8px\">" + esc(t.strategy_id.replace(/_/g, " ")) + " " + esc(t.side) +
      ' <span class="muted" style="font-size:20px">' + esc(t.symbol) + "</span></h1>" +
      '<p class="page-sub">' + etTime(t.entry_at) + " → " + etTime(t.exit_at) + " ET · " +
      esc(t.execution_mode.replace("_", "-")) + " · " + esc(t.strategy_id) + " v" + esc(t.strategy_version) +
      "</p></div>" +
      '<div class="row"><span class="num ' + cls(t.r_multiple) + '" style="font-size:30px">' +
      fmtR(t.r_multiple) + '</span><span class="muted">' + outcomeWord(t.r_multiple) + "</span></div></div>" +

      '<section class="card"><div class="card-head"><span class="eyebrow">Chart</span>' +
      '<span class="muted small">entry · stop · target · MFE · MAE</span></div>' +
      '<div class="chart-wrap">' + tradeChart(t, { w: 900, h: 330, big: true }) + "</div>" +
      '<p class="chart-cap">Synthetic price path standing in for the captured screenshot set. In production ' +
      'this panel plays the four snapshots below, taken automatically at capture time.</p>' +
      '<div class="row" style="margin-top:10px">' + (t.media || []).map(function (a) {
        return '<span class="chip chip-ghost">' + esc(a.phase.replace("_", " ")) + " · " + esc(a.timeframe) + "</span>";
      }).join("") + "</div></section>" +

      '<div class="stats stats-4" style="margin-top:18px">' +
        stat("R", fmtR(t.r_multiple), outcomeWord(t.r_multiple), cls(t.r_multiple)) +
        stat("Net P&L", fmtMoney(t.net_pnl), "fees " + fmtMoney(-(t.fees || 0)), "sm " + cls(t.net_pnl)) +
        stat("MFE / MAE", fmtR(t.mfe_r, 1) + " / " + fmtR(t.mae_r, 1),
             t.r_captured_pct != null
               ? "kept " + fmtNum(t.r_captured_pct, 0) + "% of the favourable move"
               : "reached " + fmtR(t.mfe_r, 1) + " before the stop", "sm") +
        stat("Held", fmtDur(t.holding_seconds), "to MFE " + fmtDur(t.seconds_to_mfe), "sm") +
      "</div>" +

      '<div class="grid g-main" style="margin-top:22px"><div class="stack">' +
        '<section class="card"><div class="card-head"><span class="eyebrow">Execution</span></div>' +
        '<div class="kv" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">' +
          '<div><span class="k">Entry</span><span class="v">' + fmtPx(t.avg_entry_price) + "</span></div>" +
          '<div><span class="k">Exit</span><span class="v">' + fmtPx(t.avg_exit_price) + "</span></div>" +
          '<div><span class="k">Initial stop</span><span class="v">' + fmtPx(t.initial_stop) + "</span></div>" +
          '<div><span class="k">Target</span><span class="v">' + fmtPx(t.initial_target) + "</span></div>" +
          '<div><span class="k">Quantity</span><span class="v">' + t.quantity + " / " + t.planned_quantity + " planned</span></div>" +
          '<div><span class="k">Size deviation</span><span class="v ' + cls(-Math.abs(t.size_deviation_pct || 0)) + '">' +
            (t.size_deviation_pct ? (t.size_deviation_pct > 0 ? "+" : MINUS) + Math.abs(t.size_deviation_pct) + "%" : "on plan") + "</span></div>" +
          '<div><span class="k">Entry slippage</span><span class="v ' +
            (t.entry_slippage_ticks < 0 ? "v-neg" : "") + '">' + fmtNum(t.entry_slippage_ticks, 2) +
            " ticks<br><span class=\"s\" style=\"font-family:var(--sans)\">" +
            (t.entry_slippage_ticks == null ? "no reference price"
              : t.entry_slippage_ticks < 0 ? "adverse" : t.entry_slippage_ticks > 0 ? "favourable" : "at price") +
            "</span></span></div>" +
          '<div><span class="k">Exit reason</span><span class="v">' + esc(t.exit_reason) + "</span></div>" +
        "</div>" +
        (t.execution_note ? '<p class="trade-note" style="margin-top:14px">' + esc(t.execution_note) + "</p>" : "") +
        '<div class="row" style="margin-top:14px">' + tagChips(t.tags) + "</div></section>" +

        '<section class="card"><div class="card-head"><span class="eyebrow">Against the mechanical reference</span></div>' +
        '<div class="stats stats-3" style="border-radius:var(--r-sm)">' +
          stat("You", fmtR(t.r_multiple), "as executed", "sm " + cls(t.r_multiple)) +
          stat("Rules alone", fmtR(t.mechanical_r), "same signal, no discretion", "sm") +
          stat("Difference", fmtR(delta), deltaWord(delta), "sm " + cls(delta)) +
        "</div>" +
        '<p class="small muted" style="margin-top:12px">The reference is recomputed from the signal and the ' +
        "strategy version in force at the time (" + esc(t.strategy_id) + " v" + esc(t.strategy_version) +
        "). It never changes when the strategy is later edited.</p></section>" +

        '<section class="card"><div class="card-head"><span class="eyebrow">Labels</span></div>' +
        '<span class="eyebrow">Confirmed by you</span><div class="row" style="margin-bottom:16px">' + tagChips(t.tags) + "</div>" +
        (accepted.length || rejected.length
          ? '<span class="eyebrow">Model suggestions</span><div class="stack-sm">' +
            accepted.concat(rejected).map(function (a) {
              return '<div class="rating"><span class="lbl"><b>' + esc(tagLabel(a.tag_code)) + "</b>" +
                '<br><span class="muted small">' + esc(a.content) + "</span></span>" +
                '<span class="row" style="gap:8px"><span class="num muted" style="font-size:12px">' +
                (a.confidence * 100).toFixed(0) + "%</span>" +
                '<span class="chip ' + (a.status === "accepted" ? "chip-accent" : "chip-ghost") + '">' +
                esc(a.status === "accepted" ? "you accepted" : "you rejected") + "</span></span></div>";
            }).join("") + "</div>" +
            '<p class="small muted" style="margin-top:12px">Suggestions never become labels on their own. ' +
            "Only the confirmed row above is used in any statistic.</p>"
          : '<p class="small muted">No model suggestions for this trade.</p>') + "</section>" +
      "</div><div class=\"stack\">" +
        '<section class="card"><div class="card-head"><span class="eyebrow">Market context at entry</span></div>' +
        '<div class="stack-sm">' +
        '<div class="rating"><span class="lbl">Trend state</span><span class="num">' + esc(mkt.trend_state || "—") + "</span></div>" +
        '<div class="rating"><span class="lbl">ATR(14)</span><span class="num">' + fmtNum(mkt.atr14, 1) + "</span></div>" +
        '<div class="rating"><span class="lbl">Opening range</span><span class="num">' +
          fmtPx(mkt.opening_range_low) + "–" + fmtPx(mkt.opening_range_high) + "</span></div>" +
        '<div class="rating"><span class="lbl">Prior close</span><span class="num">' + fmtPx(mkt.prior_close) + "</span></div>" +
        '<div class="rating"><span class="lbl">Session cumulative after</span><span class="num ' +
          cls(t.session_cum_pnl_after) + '">' + fmtMoney(t.session_cum_pnl_after) + "</span></div>" +
        "</div></section>" +
        '<section class="card"><div class="card-head"><span class="eyebrow">Session state</span></div>' +
        '<div class="stack-sm">' +
          rating("Energy that morning", (s.pre || {}).energy) +
          rating("Focus that morning", (s.pre || {}).focus) +
          rating("Stress that morning", (s.pre || {}).stress, true) +
        "</div>" +
        '<p class="small muted" style="margin-top:10px">Shown because you reported it, not because a ' +
        "correlation has been established.</p></section>" +
        researchDetails(t) +
      "</div></div>";
  }

  function researchDetails(t) {
    return '<details class="disclosure card"><summary>Research details</summary>' +
      '<div class="stack-sm">' +
      '<div class="rating"><span class="lbl">Trade UID</span><span class="num small">' + esc(t.trade_uid) + "</span></div>" +
      '<div class="rating"><span class="lbl">Calc version</span><span class="num small">' + esc(D.meta.calc_version) + "</span></div>" +
      '<div class="rating"><span class="lbl">Gross / fees</span><span class="num small">' +
        fmtMoney(t.gross_pnl) + " / " + fmtMoney(-(t.fees || 0)) + "</span></div>" +
      '<div class="rating"><span class="lbl">Seconds to MAE</span><span class="num small">' + (t.seconds_to_mae || 0) + "s</span></div>" +
      '<div class="rating"><span class="lbl">Opportunity status</span><span class="num small">' + esc(t.opportunity_status || "—") + "</span></div>" +
      "</div>" +
      '<div class="warnband" style="margin-top:14px"><span class="g">blinded</span>' +
      "<p>Blinded research features exist for this session but are withheld here by design. " +
      "They are only readable in <a href=\"#/research\">Research Mode</a>, and opening them is logged.</p></div>" +
      "</details>";
  }

  /* ------------------------------------------------------------------ view: CALENDAR */
  var calMonth = null;

  function viewCalendar() {
    var months = monthsDesc();
    if (!calMonth || months.indexOf(calMonth) < 0) calMonth = months[0];
    var parts = calMonth.split("-"), yr = +parts[0], mo = +parts[1];
    var first = new Date(Date.UTC(yr, mo - 1, 1));
    var startDow = first.getUTCDay();
    var days = new Date(Date.UTC(yr, mo, 0)).getUTCDate();
    var list = sessionsIn(calMonth, "iso_month");
    var a = aggregate(list);

    var cells = "";
    for (var i = 0; i < startDow; i++) cells += '<div class="cal-cell empty" aria-hidden="true"></div>';
    for (var d = 1; d <= days; d++) {
      var key = yr + "-" + pad(mo) + "-" + pad(d);
      var s = BY_DATE[key];
      var dow = new Date(Date.UTC(yr, mo - 1, d)).getUTCDay();
      if (!s) {
        cells += '<div class="cal-cell empty"><span class="cal-day">' + d + "</span>" +
          '<span class="cal-tag muted">' + (dow === 0 || dow === 6 ? "Weekend" : "No session") + "</span></div>";
        continue;
      }
      var mm = m(s), marks = [];
      if (mm.mistake_count) marks.push('<span class="mark mark-flag">' + mm.mistake_count + " flag" + (mm.mistake_count > 1 ? "s" : "") + "</span>");
      if (mm.opportunities_missed) marks.push('<span class="mark mark-watch">' + mm.opportunities_missed + " missed</span>");
      if (!mm.mistake_count && mm.process_score >= 80) marks.push('<span class="mark mark-good">good process</span>');
      cells += '<a class="cal-cell linked" href="#/session/' + key + '">' +
        '<span class="cal-day">' + d + " · " + DAYS[dow].slice(0, 3) + "</span>" +
        '<span class="cal-r ' + cls(mm.total_r) + '">' + (mm.trade_count ? fmtR(mm.total_r, 1) : "No trade") + "</span>" +
        '<span class="cal-tag">' + (mm.trade_count ? mm.trade_count + (mm.trade_count === 1 ? " trade" : " trades") : "Stayed out") +
        (mm.process_score != null ? " · process " + fmtNum(mm.process_score, 0) : "") + "</span>" +
        '<span class="cal-marks">' + marks.join("") + "</span></a>";
    }

    return '<div class="page-head"><div class="grow">' +
